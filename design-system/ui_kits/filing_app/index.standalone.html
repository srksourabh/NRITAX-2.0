<script type="text/babel" data-presets="react">
const { AppShell, StatusPill, Button, ExpertPanel } = window.NRITAX20DesignSystem_c86cd4;
const SCREENS = { dashboard: 'My returns', documents: 'Your details', income: 'Income', review: 'Review', filed: 'File and verify' };

function App() {
  const [screen, setScreen] = React.useState('dashboard');
  const [expert, setExpert] = React.useState(false);
  const [thread, setThread] = React.useState([
    { from: 'expert', text: 'I have looked at your 26AS. One TDS entry from HDFC was missing in your draft, so I added it.', at: '10:12' },
    { from: 'you', text: 'Does that change my refund?', at: '10:14' },
    { from: 'expert', text: 'Yes. Your refund goes up by ₹8,000. Nothing else needs to change.', at: '10:15' },
  ]);
  const Screen = { dashboard: window.Dashboard, documents: window.DocumentsStep, income: window.IncomeStep, review: window.ReviewStep, filed: window.FiledScreen }[screen];
  return (
    <div style={{ display: 'flex', height: '100%', minHeight: '100vh' }}>
      <div style={{ flex: 1, minWidth: 0 }}>
        <AppShell
          nav={Object.keys(SCREENS).map((k) => ({ label: SCREENS[k], active: screen === k, onClick: () => setScreen(k) }))}
          right={<div style={{ display: 'flex', alignItems: 'center', gap: '12px' }}>
            <span className="ntx-wide-only"><StatusPill onInk status={screen === 'filed' ? 'filed_unverified' : 'review_user'} /></span>
            <Button size="compact" variant="secondary" onClick={() => setExpert((v) => !v)}>Ask a CA</Button>
          </div>}>
          <Screen go={setScreen} />
        </AppShell>
      </div>
      {expert ? (
        <div style={{ width: '400px', flex: '0 0 400px', height: '100vh', position: 'sticky', top: 0 }}>
          <ExpertPanel expert={{ name: 'Meera Raghavan', initials: 'MR', credential: 'CA · M. No. 2XXXXX', lastActive: 'active 2 min ago' }}
            messages={thread} onClose={() => setExpert(false)}
            onSend={(t) => setThread((m) => m.concat([{ from: 'you', text: t, at: 'now' }]))} />
        </div>
      ) : null}
    </div>
  );
}
ReactDOM.createRoot(document.getElementById('root')).render(<App />);
</script></body></html>
