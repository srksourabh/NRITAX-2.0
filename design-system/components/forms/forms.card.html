<!-- @dsCard group="Components" viewport="700x400" name="Forms" subtitle="Money input, character boxes, fields and choices" -->
<!DOCTYPE html><html lang="en"><head><meta charset="utf-8"><link rel="stylesheet" href="../../styles.css">
<style>body{padding:20px;background:var(--paper)}.grid{display:grid;grid-template-columns:1fr 1fr;gap:20px 24px}</style>
</head><body><div id="root"></div>
<script src="https://unpkg.com/react@18.3.1/umd/react.development.js" integrity="sha384-hD6/rw4ppMLGNu3tX5cjIb+uRZ7UkRJ6BPkLpg4hAu/6onKUg4lLsHAs9EBPT82L" crossorigin="anonymous"></script>
<script src="https://unpkg.com/react-dom@18.3.1/umd/react-dom.development.js" integrity="sha384-u6aeetuaXnQ38mYT8rp6sbXaQe3NL9t+IBXmnYxwkUI2Hw4bsp2Wvmx4yRQF1uAm" crossorigin="anonymous"></script>
<script src="https://unpkg.com/@babel/standalone@7.29.0/babel.min.js" integrity="sha384-m08KidiNqLdpJqLq95G/LEi8Qvjl/xUYll3QILypMoQ65QorJ9Lvtp2RXYGBFj1y" crossorigin="anonymous"></script>
<script src="../../_ds_bundle.js"></script>
<script type="text/babel">
const { Input, MoneyInput, CharacterBoxInput, Select, Checkbox, RadioGroup, Switch } = window.NRITAX20DesignSystem_c86cd4;
function Demo(){
  const [amt,setAmt]=React.useState('1234567');
  const [pan,setPan]=React.useState('ABCPD1234');
  const [reg,setReg]=React.useState('aadhaar');
  return (<div className="grid">
    <MoneyInput label="Gross salary" value={amt} onChange={setAmt} source="Form 16" required/>
    <Input label="Name as on PAN" defaultValue="Rohit S Deshpande" hint="Exactly as printed, including initials"/>
    <div style={{gridColumn:'1 / -1'}}><CharacterBoxInput kind="pan" label="PAN" value={pan} onChange={setPan} hint="Ten characters, as printed on your card"/></div>
    <Input label="Tax deducted" mono align="right" defaultValue="1,12,000" error="TDS cannot be more than the salary you entered."/>
    <Select label="Assessment year" options={[{value:'2026-27',label:'2026-27'},{value:'2025-26',label:'2025-26'}]}/>
    <RadioGroup label="How do you want to verify?" value={reg} onChange={setReg} options={[{value:'aadhaar',label:'Aadhaar OTP',hint:'Needs the mobile linked to your Aadhaar'},{value:'net',label:'Net banking'}]}/>
    <div><Checkbox label="I held foreign assets during the year" hint="Schedule FA becomes applicable" checked onChange={()=>{}}/>
    <Switch label="Email me when the department processes this return" checked onChange={()=>{}}/></div>
  </div>);}
ReactDOM.createRoot(document.getElementById('root')).render(<Demo/>);
</script></body></html>
