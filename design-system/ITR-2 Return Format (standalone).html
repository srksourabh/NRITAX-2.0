document.addEventListener('DOMContentLoaded', async function() {
  const loading = document.getElementById('__bundler_loading');
  function setStatus(msg) { if (loading) loading.textContent = msg; }

  const FONT_MIME = /^(font[/]|application[/](x-)?font-|application[/]vnd\.ms-fontobject)/i;
  const MIME_TOKEN = /^[\w.+-]+[/][\w.+-]+$/;
  function toBase64(bytes) {
    let bin = '';
    for (let i = 0; i < bytes.length; i += 0x8000) {
      bin += String.fromCharCode.apply(null, bytes.subarray(i, i + 0x8000));
    }
    return btoa(bin);
  }

  // Error sink persists across replaceWith since it's on window, not the DOM.
  window.addEventListener('error', function(e) {
    // Failed resource loads (CSP-blocked links, scripts, images) fire plain
    // events at the element — warn only; real JS errors carry message/error.
    if (!e.message && !e.error && e.target && e.target !== window) {
      console.warn('[bundle] resource failed to load:',
        e.target.tagName, String(e.target.src || e.target.href || ''));
      return;
    }
    var p = document.body || document.documentElement;
    var d = document.getElementById('__bundler_err') || p.appendChild(document.createElement('div'));
    d.id = '__bundler_err';
    d.style.cssText = 'position:fixed;bottom:12px;left:12px;right:12px;font:12px/1.4 ui-monospace,monospace;background:#2a1215;color:#ff8a80;padding:10px 14px;border-radius:8px;border:1px solid #5c2b2e;z-index:99999;white-space:pre-wrap;max-height:40vh;overflow:auto';
    d.textContent = (d.textContent ? d.textContent + String.fromCharCode(10) : '') +
      '[bundle] ' + (e.message || e.type) +
      (e.filename ? ' (' + e.filename.slice(0, 60) + ':' + e.lineno + ')' : '');
  }, true);

  try {
    const manifestEl = document.querySelector('script[type="__bundler/manifest"]');
    const templateEl = document.querySelector('script[type="__bundler/template"]');
    if (!manifestEl || !templateEl) {
      setStatus('Error: missing bundle data');
      console.error('[bundler] Missing script tags — manifestEl:', !!manifestEl, 'templateEl:', !!templateEl);
      return;
    }

    const manifest = JSON.parse(manifestEl.textContent);
    let template = JSON.parse(templateEl.textContent);

    // Nested page bundles (iframe targets). Each ships ONCE, in the ROOT
    // document's manifest; frame srcs carry an about:blank#<uuid> marker
    // instead of a substitutable uuid. Every document mints the blobs for
    // its OWN frames — from local text at the root, or text obtained from
    // its DIRECT parent over the relay protocol below — so each frame
    // navigation stays same-origin with its initiator and a deduped page
    // loads at any depth on any host, including a file:// download's
    // opaque origins (where a blob minted by one document cannot be
    // navigated to by another).
    const pageOrderEl = document.querySelector('script[type="__bundler/page_order"]');
    const pageOrder = pageOrderEl ? JSON.parse(pageOrderEl.textContent) : [];
    const pageSet = new Set(pageOrder);
    const pageTexts = {};

    // ── Nested-page text protocol (parent-chain relay) ──
    // Page bundles ship once, in the ROOT document's manifest. Every
    // document mints the blobs for its OWN frames, obtaining page text
    // through a strict parent-chain relay: a document only ever SENDS to
    // its direct parent (which, for every document the publisher's own
    // runtime minted, is another publisher document) and only ACCEPTS
    // text from that direct parent; requests from below are honored only
    // for the document's own child frames, and the ROOT never sends
    // upward at all. That last rule is load-bearing: the artifact host's
    // frame-ancestors allows claude.ai (and friends) to frame an
    // artifact, so window.top can be a FOREIGN document — a top-addressed
    // protocol would hand page uuids to that ancestor and accept forged
    // "page text" from it, minting attacker HTML as an artifact-origin
    // blob document. The chain never touches the ancestor: requests stop
    // at the root, replies are origin-addressed per hop (never '*' when
    // an origin exists), and both directions are origin-gated (on https
    // a foreign sender's origin can never equal this document's; in
    // opaque contexts — file:// — everything serializes as 'null', where
    // an embedded EXTERNAL frame still fails the gate by carrying its
    // own real origin, and a sandboxed child of such a frame is excluded
    // by the own-child-frames check plus uuid unguessability). Shape is
    // deny-by-default: one request form, one reply form, no error
    // replies.
    // window.origin is the SERIALIZED SECURITY origin ('null' in opaque
    // contexts such as a sandboxed preview iframe) — location.origin is
    // computed from the URL and stays 'https://…' even when the document
    // is sandboxed, which would misgate every opaque chain.
    const OWN_TARGET = /^https?:[/][/]/.test(window.origin || '')
      ? window.origin
      : '*';
    function trustedOrigin(e) {
      if (e.origin === window.origin) return true; // https chains; opaque==opaque
      // file:// trees: Chrome serializes the file document's origin as
      // 'file://' while the blob: documents it mints serialize as 'null',
      // so the two legitimate shapes can never string-match — accept the
      // pair in both directions. https origins never serialize as either,
      // and sender identity (own child frame / direct parent) is checked
      // separately.
      return (
        (e.origin === 'null' &&
          (window.origin === 'file://' ||
            window.location.protocol === 'file:')) ||
        (/^file:/.test(e.origin) && window.origin === 'null')
      );
    }
    // Non-empty only in the root document (nested bundles ship an empty
    // island), so it doubles as the root marker: the root answers from
    // local text and treats a miss as authoritative — never relaying to
    // its (possibly foreign) parent.
    const isPageRoot = pageOrder.length > 0;
    const blobUrls = {};
    const resourceBlobs = {};
    const UUID_SHAPE = /^[0-9a-f]{8}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{12}$/;
    const pendingFrames = {}; // uuid -> [{el, frag}] awaiting text for own frames
    const pendingRelays = {}; // uuid -> [childWindow] awaiting text to pass down
    function mountPage(el, frag, text) {
      const pageBlob = new Blob([text], { type: 'text/html' });
      const u = URL.createObjectURL(pageBlob);
      resourceBlobs[u] = pageBlob;
      el.src = u + frag;
    }
    function deliverPage(uuid, text) {
      const frames = pendingFrames[uuid];
      delete pendingFrames[uuid];
      if (frames) for (const f of frames) mountPage(f.el, f.frag, text);
      const relays = pendingRelays[uuid];
      delete pendingRelays[uuid];
      if (relays) {
        for (const cw of relays) {
          try { cw.postMessage({ __bundler_page: uuid, __bundler_text: text }, OWN_TARGET); } catch (err) { /* gone */ }
        }
      }
    }
    function ownFrameWindows() {
      const out = [];
      for (const f of Array.from(document.querySelectorAll('iframe'))) {
        try { if (f.contentWindow) out.push(f.contentWindow); } catch (err) { /* detached */ }
      }
      return out;
    }
    window.addEventListener('message', function (e) {
      const d = e.data;
      if (!d || typeof d !== 'object' || !e.source) return;
      // Origin gate first; the structural checks below (own-child-frames
      // for requests, direct-parent + solicited-uuid for replies, the
      // root's never-relay rule) are what hold in fully opaque chains
      // where origin strings can't discriminate — a sandboxed root's
      // FOREIGN wrapper still fails all three even though both serialize
      // as real-vs-'null' rather than matching.
      if (!trustedOrigin(e)) return;
      if (typeof d.__bundler_need === 'string' && UUID_SHAPE.test(d.__bundler_need)) {
        // Requests are honored only for this document's own child frames.
        if (ownFrameWindows().indexOf(e.source) < 0) return;
        const uuid = d.__bundler_need;
        const text = pageTexts[uuid];
        if (typeof text === 'string') {
          try { e.source.postMessage({ __bundler_page: uuid, __bundler_text: text }, OWN_TARGET); } catch (err) { /* gone */ }
          return;
        }
        if (isPageRoot || window.parent === window) return; // authoritative miss
        const waiting = pendingRelays[uuid];
        if (waiting) {
          if (waiting.indexOf(e.source) < 0) waiting.push(e.source);
          return;
        }
        // Never-answered uuids would otherwise accumulate forever under a
        // request spray; past the cap (far above any real page count) new
        // relays are dropped rather than remembered.
        if (Object.keys(pendingRelays).length >= 128) return;
        pendingRelays[uuid] = [e.source];
        window.parent.postMessage({ __bundler_need: uuid }, OWN_TARGET);
      } else if (
        typeof d.__bundler_page === 'string' &&
        UUID_SHAPE.test(d.__bundler_page) &&
        typeof d.__bundler_text === 'string'
      ) {
        // The shape test is load-bearing beyond tidiness: the solicited
        // check below uses the in operator, which matches prototype keys
        // ('__proto__', 'constructor') — an unshaped key would reach
        // deliverPage and throw, painting the error banner.
        // Text is accepted only from the direct parent — the document
        // that minted this one.
        if (e.source !== window.parent || window.parent === window) return;
        if (!(d.__bundler_page in pendingFrames) && !(d.__bundler_page in pendingRelays)) return;
        deliverPage(d.__bundler_page, d.__bundler_text);
      }
    });

    const uuids = Object.keys(manifest);
    setStatus('Unpacking ' + uuids.length + ' assets...');

    await Promise.all(uuids.map(async (uuid) => {
      const entry = manifest[uuid];
      try {
        const binaryStr = atob(entry.data);
        const bytes = new Uint8Array(binaryStr.length);
        for (let i = 0; i < binaryStr.length; i++) bytes[i] = binaryStr.charCodeAt(i);

        let finalBytes = bytes;
        if (entry.compressed) {
          if (typeof DecompressionStream !== 'undefined') {
            const ds = new DecompressionStream('gzip');
            const writer = ds.writable.getWriter();
            const reader = ds.readable.getReader();
            writer.write(bytes);
            writer.close();
            const chunks = [];
            let totalLen = 0;
            while (true) {
              const { done, value } = await reader.read();
              if (done) break;
              chunks.push(value);
              totalLen += value.length;
            }
            finalBytes = new Uint8Array(totalLen);
            let offset = 0;
            for (const chunk of chunks) { finalBytes.set(chunk, offset); offset += chunk.length; }
          } else {
            console.warn('DecompressionStream not available, asset ' + uuid + ' may not render');
          }
        }

        if (pageSet.has(uuid)) {
          pageTexts[uuid] = new TextDecoder().decode(finalBytes);
          return;
        }
        if (FONT_MIME.test(entry.mime) && MIME_TOKEN.test(entry.mime)) {
          // Strict artifact hosts allow font-src data: but not blob:.
          blobUrls[uuid] = 'data:' + entry.mime + ';base64,' +
            (entry.compressed ? toBase64(finalBytes) : entry.data);
        } else {
          const blob = new Blob([finalBytes], { type: entry.mime });
          blobUrls[uuid] = URL.createObjectURL(blob);
          resourceBlobs[blobUrls[uuid]] = blob;
        }
      } catch (err) {
        console.error('Failed to decode asset ' + uuid + ':', err);
        const blob = new Blob([], { type: entry.mime });
        blobUrls[uuid] = URL.createObjectURL(blob);
        resourceBlobs[blobUrls[uuid]] = blob;
      }
    }));

    const extResEl = document.querySelector('script[type="__bundler/ext_resources"]');
    const extResources = extResEl ? JSON.parse(extResEl.textContent) : [];
    const resourceMap = {};
    for (const entry of extResources) {
      if (blobUrls[entry.uuid]) resourceMap[entry.id] = blobUrls[entry.uuid];
    }

    // Artifact-host CSP (connect-src 'self') refuses fetch() of blob: URLs —
    // consumers read these Blobs directly. Survives the swap like the error sink.
    window.__resourceBlobs = resourceBlobs;

    setStatus('Rendering...');
    // Page uuids have no blob here — they ride inside about:blank#<uuid>
    // frame markers the pass below resolves after the swap.
    for (const uuid of uuids) {
      if (pageSet.has(uuid)) continue;
      template = template.split(uuid).join(blobUrls[uuid]);
    }

    // Strip integrity + crossorigin — blob URLs from a file:// document inherit
    // a null origin, so crossorigin forces a CORS fetch that SRI then rejects.
    // The manifest bytes are ours; SRI protects against CDN compromise, not this.
    template = template.replace(/\s+integrity="[^"]*"/gi, '').replace(/\s+crossorigin="[^"]*"/gi, '');

    const resourceScript = '<script>window.__resources = ' +
      JSON.stringify(resourceMap).replace(/<\//g, '<\\/') +
      ';</' + 'script>';
    // Inject after <head> so the DOCTYPE stays first; prepending the script
    // would push the parser into quirks mode. DOMParser always emits a <head>
    // (synthesizing one if the source HTML omitted it) but may carry
    // attributes through, so match the full opening tag. slice() rather than
    // replace() keeps us clear of $-pattern substitution in resourceScript.
    const headOpen = template.match(/<head[^>]*>/i);
    if (headOpen) {
      const i = headOpen.index + headOpen[0].length;
      template = template.slice(0, i) + resourceScript + template.slice(i);
    }

    // Parse the template and swap the root element. Scripts inserted via
    // DOMParser/replaceWith are inert per spec — re-create each with
    // createElement so they execute, awaiting onload for src scripts to
    // preserve ordering (React before ReactDOM before Babel before text/babel).
    const doc = new DOMParser().parseFromString(template, 'text/html');
    document.documentElement.replaceWith(doc.documentElement);

    // Resolve page-frame markers: mint this document's own blob for each
    // framed page — from local text when this is the root, otherwise by
    // asking the direct parent over the relay protocol above. An
    // unanswered request leaves the frame on about:blank, the same
    // degraded state as a refused embed.
    {
      const MARKER = /^about:blank#([0-9a-f]{8}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{12})(#.*)?$/;
      const needed = [];
      for (const el of Array.from(document.querySelectorAll('iframe'))) {
        const m = MARKER.exec(el.getAttribute('src') || '');
        if (!m) continue;
        const text = pageTexts[m[1]];
        if (typeof text === 'string') {
          mountPage(el, m[2] || '', text);
        } else if (window.parent !== window && !isPageRoot) {
          const had = pendingFrames[m[1]];
          (pendingFrames[m[1]] = had || []).push({ el: el, frag: m[2] || '' });
          if (!had) needed.push(m[1]);
        }
      }
      for (const uuid of needed) {
        window.parent.postMessage({ __bundler_need: uuid }, OWN_TARGET);
      }
    }

    const dead = Array.from(document.scripts);
    for (const old of dead) {
      const s = document.createElement('script');
      for (const a of old.attributes) s.setAttribute(a.name, a.value);
      s.textContent = old.textContent;
      // text/babel scripts with a src: read and inline. transformScriptTags
      // does XHR against the src, but blob:null/ from a file:// origin is
      // silently dropped. Inlining makes it a plain inline babel script,
      // which transformScriptTags handles unconditionally.
      if ((s.type === 'text/babel' || s.type === 'text/jsx') && s.src) {
        const pre = resourceBlobs[s.src.split('#')[0]];
        s.textContent = pre ? await pre.text() : await (await fetch(s.src)).text();
        s.removeAttribute('src');
      }
      const p = s.src ? new Promise(function(r) { s.onload = s.onerror = r; }) : null;
      old.replaceWith(s);
      if (p) await p;
    }
    // Babel standalone auto-transforms type=text/babel on DOMContentLoaded,
    // which fired before we swapped the document. Trigger manually if present.
    if (window.Babel && typeof window.Babel.transformScriptTags === 'function') {
      window.Babel.transformScriptTags();
    }
  } catch (err) {
    setStatus('Error unpacking: ' + err.message);
    console.error('Bundle unpack error:', err);
  }
});

"<!DOCTYPE html>\n<html lang=\"en\"><head>\n<meta charset=\"utf-8\">\n<meta name=\"viewport\" content=\"width=device-width,initial-scale=1\">\n<title>ITR-2 · AY 2026-27 · Return Format<\u002Ftitle>\n<style>\n:root{\n  --ink:#141C29; --ink-2:#2A3849; --paper:#F5F6F8; --card:#FFFFFF;\n  --line:#D9DEE6; --line-2:#EDEFF3;\n  --mand:#B3261E; --mand-bg:#FDEDEC;\n  --opt:#1B5E9C;  --opt-bg:#EDF4FB;\n  --seal:#0D6B5B; --seal-2:#0A5347;\n  --warn:#9A6212; --warn-bg:#FDF4E3;\n  --muted:#67748A;\n  --mono:ui-monospace,\"SF Mono\",\"JetBrains Mono\",\"Roboto Mono\",Menlo,monospace;\n  --sans:\"Inter Tight\",Inter,\"Segoe UI\",system-ui,-apple-system,sans-serif;\n  --rail:250px;\n}\n*{box-sizing:border-box}\nhtml,body{margin:0;padding:0}\nbody{background:var(--paper);color:var(--ink);font-family:var(--sans);font-size:14px;line-height:1.45;-webkit-font-smoothing:antialiased}\nbutton,input,select,textarea{font-family:inherit;font-size:inherit;color:inherit}\n:focus-visible{outline:2px solid var(--seal);outline-offset:2px}\n\n/* ---------- masthead ---------- */\n.mast{position:sticky;top:0;z-index:60;background:var(--ink);color:#fff;border-bottom:3px solid var(--seal)}\n.mast-in{display:flex;align-items:center;gap:16px;padding:10px 18px;flex-wrap:wrap}\n.mark{display:flex;flex-direction:column;line-height:1.05}\n.mark b{font-size:17px;letter-spacing:.02em;font-weight:650}\n.mark span{font-size:10.5px;color:#93A1B5;letter-spacing:.14em;text-transform:uppercase;margin-top:3px}\n.seal{width:56px;height:56px;border-radius:50%;border:2px solid var(--seal);display:grid;place-items:center;\n  background:radial-gradient(circle at 50% 42%,rgba(13,107,91,.35),rgba(13,107,91,.06));position:relative;flex:none}\n.seal em{font-style:normal;font-family:var(--mono);font-size:15px;font-weight:700;color:#8FE3D0}\n.seal small{position:absolute;bottom:6px;font-size:7px;letter-spacing:.1em;color:#6E8FA0}\n.spacer{flex:1}\n.acts{display:flex;gap:7px;flex-wrap:wrap}\n.btn{border:1px solid #3A4A5F;background:#1D2837;color:#DDE4EC;padding:7px 12px;border-radius:5px;cursor:pointer;\n  font-size:12.5px;font-weight:520;display:inline-flex;align-items:center;gap:6px;white-space:nowrap;transition:.13s}\n.btn:hover{background:#26344a;border-color:#55697F}\n.btn.pri{background:var(--seal);border-color:var(--seal);color:#fff}\n.btn.pri:hover{background:var(--seal-2)}\n.btn.gh{background:transparent}\n.btn:disabled{opacity:.45;cursor:not-allowed}\n\n/* ---------- layout ---------- */\n.wrap{display:grid;grid-template-columns:var(--rail) 1fr;gap:0;align-items:start}\n.rail{position:sticky;top:79px;height:calc(100vh - 79px);overflow-y:auto;background:var(--ink-2);\n  border-right:1px solid #1D2837;padding:12px 0 40px}\n.rail h4{margin:0;padding:10px 14px 6px;font-size:9.5px;letter-spacing:.16em;text-transform:uppercase;color:#8296AE;font-weight:600}\n.nav{display:flex;align-items:center;gap:9px;padding:7px 12px 7px 14px;cursor:pointer;color:#C6D0DD;font-size:12.5px;\n  border-left:3px solid transparent;transition:.12s}\n.nav:hover{background:#33445A;color:#fff}\n.nav.on{background:#0F1722;border-left-color:var(--seal);color:#fff;font-weight:600}\n.nav .no{font-family:var(--mono);font-size:10px;color:#7C8EA4;width:20px;flex:none}\n.nav .nm{flex:1;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}\n.pip{width:7px;height:7px;border-radius:50%;background:#4C5F76;flex:none}\n.pip.part{background:var(--warn)}\n.pip.done{background:#3FBF9E}\n.pip.err{background:#E5645A}\n\n.main{padding:22px 26px 120px;max-width:1120px;min-width:0}\n\n/* ---------- schedule ---------- */\n.sch{background:var(--card);border:1px solid var(--line);border-radius:8px;margin-bottom:20px;overflow:hidden}\n.sch-h{display:flex;align-items:center;gap:12px;padding:13px 18px;background:#F0F2F6;border-bottom:1px solid var(--line)}\n.sch-h .idx{font-family:var(--mono);font-size:11px;color:var(--muted);background:#fff;border:1px solid var(--line);\n  border-radius:4px;padding:2px 7px;flex:none}\n.sch-h h2{margin:0;font-size:15.5px;font-weight:640;letter-spacing:-.01em}\n.sch-h .sub{font-size:11.5px;color:var(--muted);margin-top:2px}\n.sch-b{padding:6px 18px 18px}\n.sec{margin-top:16px}\n.sec>legend,.sec-t{font-size:11px;font-weight:700;letter-spacing:.11em;text-transform:uppercase;color:var(--ink-2);\n  padding:7px 0 6px;border-bottom:2px solid var(--ink);margin-bottom:12px;display:block}\n\n.grid{display:grid;grid-template-columns:repeat(12,1fr);gap:11px 14px}\n.f{display:flex;flex-direction:column;gap:4px;min-width:0}\n.c2{grid-column:span 2}.c3{grid-column:span 3}.c4{grid-column:span 4}\n.c5{grid-column:span 5}.c6{grid-column:span 6}.c8{grid-column:span 8}.c12{grid-column:span 12}\n\nlabel.lb{font-size:11.5px;font-weight:550;color:var(--ink-2);display:flex;align-items:flex-start;gap:5px;line-height:1.3}\n.req{color:var(--mand);font-weight:800;flex:none}\n.optd{color:var(--opt);font-weight:800;flex:none;font-size:13px;line-height:1}\n.lbtx{flex:1;min-width:0}\n.tag{font-family:var(--mono);font-size:9px;color:#9AA6B8;font-weight:400;display:block;margin-top:1px}\n\n.ib{display:flex;gap:0;align-items:stretch}\n.ctl{width:100%;padding:7px 9px;border:1px solid var(--line);border-radius:5px;background:#fff;min-width:0}\n.ctl:focus{border-color:var(--seal);box-shadow:0 0 0 3px rgba(13,107,91,.11);outline:none}\n.ctl[readonly],.ctl:disabled{background:#F2F4F7;color:#5C6879}\n.ib .ctl{border-radius:5px 0 0 5px;border-right:0}\n.ib.solo .ctl{border-radius:5px;border-right:1px solid var(--line)}\ninput[type=number].ctl,.num{font-family:var(--mono);text-align:right;font-variant-numeric:tabular-nums}\n.f.M .ctl{border-left:3px solid var(--mand)}\n.f.O .ctl{border-left:3px solid var(--opt)}\n.f.bad .ctl{border-color:var(--mand);background:var(--mand-bg)}\n.err{font-size:10.5px;color:var(--mand);font-weight:550}\n.hint{font-size:10.5px;color:var(--muted)}\n\n/* auto-fetch */\n.af{border:1px solid var(--line);border-left:0;border-radius:0 5px 5px 0;background:#F4F6F9;color:var(--seal);\n  padding:0 9px;cursor:pointer;display:grid;place-items:center;position:relative;flex:none;font-size:13px;transition:.12s}\n.af:hover{background:var(--seal);color:#fff;border-color:var(--seal)}\n.af[data-src=\"\"]{color:#B3BCC9;cursor:not-allowed}\n.af .tip{position:absolute;bottom:calc(100% + 7px);right:0;background:var(--ink);color:#fff;font-size:11px;\n  padding:6px 9px;border-radius:5px;white-space:nowrap;opacity:0;pointer-events:none;transition:.14s;z-index:40;\n  font-weight:500;box-shadow:0 5px 16px rgba(0,0,0,.22);max-width:290px;white-space:normal;width:max-content}\n.af:hover .tip{opacity:1}\n.af .tip b{color:#8FE3D0;display:block;font-size:10px;letter-spacing:.07em;text-transform:uppercase;margin-bottom:2px}\n\n/* tables */\n.tw{overflow-x:auto;border:1px solid var(--line);border-radius:6px;margin-top:4px}\ntable.rep{border-collapse:collapse;width:100%;min-width:640px}\ntable.rep th{background:#EEF1F5;font-size:10.5px;font-weight:650;text-align:left;padding:8px 9px;\n  border-bottom:1px solid var(--line);border-right:1px solid var(--line-2);white-space:nowrap;color:var(--ink-2)}\ntable.rep th .req{margin-left:3px}\ntable.rep td{padding:4px 5px;border-bottom:1px solid var(--line-2);border-right:1px solid var(--line-2);vertical-align:top}\ntable.rep tr:last-child td{border-bottom:0}\ntable.rep td .ctl{padding:5px 7px;font-size:12.5px}\ntable.rep .rn{font-family:var(--mono);font-size:11px;color:var(--muted);text-align:center;background:#F8F9FB;width:34px}\n.tbar{display:flex;gap:7px;padding:8px 2px 0}\n.mini{border:1px solid var(--line);background:#fff;padding:4px 10px;border-radius:4px;font-size:11.5px;cursor:pointer;font-weight:550}\n.mini:hover{background:#EEF1F5;border-color:var(--muted)}\n.mini.dgr{color:var(--mand);border-color:#EFC9C6}\n\n/* computed rows */\n.calc{display:flex;justify-content:space-between;align-items:center;gap:14px;padding:8px 12px;background:#F0F5F3;\n  border:1px solid #CDE3DC;border-radius:5px;margin-top:8px}\n.calc .k{font-size:12px;font-weight:600;color:var(--seal-2)}\n.calc .v{font-family:var(--mono);font-size:14px;font-weight:700;color:var(--seal-2);font-variant-numeric:tabular-nums}\n\n/* banners */\n.bn{border:1px solid;border-radius:6px;padding:11px 14px;font-size:12.5px;margin-bottom:16px;display:flex;gap:10px}\n.bn.k{border-color:#CFE0EF;background:var(--opt-bg);color:#134A7C}\n.bn.w{border-color:#EBD6AC;background:var(--warn-bg);color:var(--warn)}\n.bn b{display:block;margin-bottom:2px}\n.lg{display:flex;gap:16px;flex-wrap:wrap;font-size:11.5px;color:var(--muted);align-items:center}\n.lg i{font-style:normal;display:inline-flex;align-items:center;gap:5px}\n.sw{width:11px;height:11px;border-radius:2px;display:inline-block}\n\n/* drawer */\n.dr{position:fixed;inset:0;background:rgba(15,22,33,.55);display:none;z-index:200;backdrop-filter:blur(2px)}\n.dr.on{display:block}\n.dr-p{position:absolute;right:0;top:0;bottom:0;width:min(680px,96vw);background:var(--card);display:flex;flex-direction:column;\n  box-shadow:-14px 0 40px rgba(0,0,0,.3)}\n.dr-h{display:flex;align-items:center;gap:10px;padding:14px 18px;border-bottom:1px solid var(--line);background:#F0F2F6}\n.dr-h h3{margin:0;font-size:14.5px;font-weight:640;flex:1}\n.dr-b{flex:1;overflow:auto;padding:16px 18px}\n.dr-f{padding:12px 18px;border-top:1px solid var(--line);display:flex;gap:8px;background:#F8F9FB}\npre.js{background:#111823;color:#C8DCE4;padding:14px;border-radius:6px;font-family:var(--mono);font-size:11.5px;\n  overflow:auto;max-height:100%;margin:0;line-height:1.5;white-space:pre-wrap;word-break:break-word}\n.vlist{list-style:none;margin:0;padding:0}\n.vlist li{padding:9px 11px;border:1px solid var(--line);border-left:3px solid var(--mand);border-radius:5px;margin-bottom:7px;\n  font-size:12.5px;cursor:pointer;background:var(--mand-bg)}\n.vlist li:hover{background:#FBDEDB}\n.vlist li b{display:block;font-size:10.5px;color:var(--muted);font-weight:600;text-transform:uppercase;letter-spacing:.07em}\n.ok{padding:22px;text-align:center;color:var(--seal-2);font-weight:600}\n\n/* toast */\n.tst{position:fixed;bottom:20px;left:50%;transform:translateX(-50%) translateY(120%);background:var(--ink);color:#fff;\n  padding:11px 20px;border-radius:7px;font-size:13px;z-index:300;transition:.28s cubic-bezier(.2,.9,.3,1);\n  box-shadow:0 10px 34px rgba(0,0,0,.3);max-width:90vw}\n.tst.on{transform:translateX(-50%) translateY(0)}\n\n/* status strip */\n.strip{position:fixed;bottom:0;left:var(--rail);right:0;background:#fff;border-top:1px solid var(--line);\n  padding:8px 22px;display:flex;align-items:center;gap:18px;font-size:12px;z-index:50}\n.strip .m{font-family:var(--mono);font-weight:700}\n.bar{flex:1;height:6px;background:var(--line-2);border-radius:3px;overflow:hidden;max-width:320px}\n.bar i{display:block;height:100%;background:var(--seal);width:0;transition:.35s}\n\n@media(max-width:900px){\n  :root{--rail:0px}\n  .rail{display:none}\n  .strip{left:0}\n  .main{padding:16px 12px 110px}\n  .grid{grid-template-columns:repeat(4,1fr)}\n  .c2,.c3,.c4,.c5,.c6,.c8,.c12{grid-column:span 4}\n}\n@media(prefers-reduced-motion:reduce){*{transition:none!important;animation:none!important}}\n\n/* ---------- return format ---------- */\n.sec-t{display:flex;align-items:center;gap:9px}\n.sec-l{font-family:var(--mono);font-size:10px;font-weight:700;color:#fff;background:var(--ink-2);\n  border-radius:3px;padding:2px 6px;letter-spacing:.04em}\ntable.ret{border-collapse:collapse;width:100%;table-layout:fixed;background:#fff}\ntable.ret col.cno{width:58px}\ntable.ret col.cin{width:36%}\ntable.ret thead th{background:#EEF1F5;font-size:9.5px;font-weight:700;letter-spacing:.13em;text-transform:uppercase;\n  color:var(--muted);text-align:left;padding:7px 10px;border-bottom:1px solid var(--line);border-right:1px solid var(--line-2)}\ntable.ret thead th.rno{text-align:center}\ntable.ret thead th.rin{text-align:right}\ntable.ret td{border-bottom:1px solid var(--line-2);border-right:1px solid var(--line-2);padding:7px 10px;vertical-align:middle}\ntable.ret tr:last-child td{border-bottom:0}\ntable.ret td:last-child{border-right:0}\ntable.ret tr:nth-child(even) td{background:#FBFCFD}\ntable.ret td.rno{font-family:var(--mono);font-size:11px;color:var(--muted);text-align:center;background:#F6F8FA;\n  white-space:nowrap;vertical-align:top;padding-top:11px}\ntable.ret tr.M td.rno{color:var(--mand);font-weight:700}\ntable.ret td.rlb{font-size:12.5px;color:var(--ink);line-height:1.35;overflow-wrap:anywhere}\ntable.ret td.rlb .tag{overflow-wrap:anywhere}\ntable.ret td.rlb label.lb{display:inline;font-size:12.5px;font-weight:500;color:var(--ink)}\ntable.ret td.rlb .tag{display:inline;margin-left:7px}\ntable.ret td.rlb .hint{display:block;margin-top:2px}\ntable.ret td.rlb .err{display:block;margin-top:2px}\ntable.ret td.rlb .err:empty{display:none}\ntable.ret td.rin{padding:5px 10px 5px 8px}\ntable.ret td.rin .ctl{padding:6px 8px;font-size:12.5px;border-left-width:1px}\ntable.ret tr.M td.rin .ctl{border-left:3px solid var(--mand)}\ntable.ret tr.O td.rin .ctl{border-left:3px solid var(--opt)}\ntable.ret tr.bad td.rin .ctl{border-color:var(--mand);background:var(--mand-bg)}\ntable.ret tr.bad td.rno{background:var(--mand-bg)}\n@media(max-width:900px){\n  table.ret col.cin{width:42%}\n  table.ret td.rlb .tag{display:none}\n}\n\n<\u002Fstyle>\n<\u002Fhead>\n<body>\n\n<div class=\"mast\">\n  <div class=\"mast-in\">\n    <div class=\"seal\"><em id=\"pct\">0%<\u002Fem><small>DONE<\u002Fsmall><\u002Fdiv>\n    <div class=\"mark\"><b>ITR-2 · Assessment Year 2026-27<\u002Fb><span>Individuals &amp; HUF · not having income from business or profession<\u002Fspan><\u002Fdiv>\n    <div class=\"spacer\"><\u002Fdiv>\n    <div class=\"acts\">\n      <button class=\"btn\" id=\"bMaster\">Master auto-fetch<\u002Fbutton>\n      <button class=\"btn gh\" id=\"bSample\">Load sample data<\u002Fbutton>\n      <button class=\"btn\" id=\"bStmt\">Import statement<\u002Fbutton>\n      <button class=\"btn gh\" id=\ orses, current year\",t:\"int\",m:0,w:6,p:\"ScheduleOS.IncFromOwnHorse.BalanceOwnRaceHorse\"},\n  {id:\"osdtaaInc\",l:\"Income from other sources taxable at DTAA rates, current year\",t:\"int\",m:0,w:6},\n  {id:\"cylaOverride\",l:\"Do you want to edit the set-off figures instead of using the computed ones?\",t:\"sel\",m:0,w:6,o:[[\"Y\",\"Yes, let me edit\"],[\"N\",\"No, keep them computed\"]]}\n ]}\n]};\n\nconst CFL_SCH={id:\"cfl\",no:\"CFL\",name:\"Schedule CFL · Carry Forward\",sub:\"Losses to be carried forward to future years\",sec:[\n {t:\"Brought forward losses of earlier assessment years\",\n  note:\"House property loss and capital losses may be carried forward for eight assessment years. Loss from owning and maintaining race horses may be carried forward for four. A loss can only be carried forward if the return for that year was filed within the due date under section 139(1).\",\n  tbl:{id:\"cfl\",t:\"Year-wise brought forward losses\",rows:3,max:16,cols:[\n   {id:\"ay\",l:\"Assessment year\",t:\"sel\",m:1,w:\"14%\",o:[\n     [\"2018-19\",\"2018-19\"],[\"2019-20\",\"2019-20\"],[\"2020-21\",\"2020-21\"],[\"2021-22\",\"2021-22\"],\n     [\"2022-23\",\"2022-23\"],[\"2023-24\",\"2023-24\"],[\"2024-25\",\"2024-25\"],[\"2025-26\",\"2025-26\"]]},\n   {id:\"fdate\",l:\"Date of filing of that return\",t:\"date\",m:1,w:\"16%\"},\n   {id:\"hpLoss\",l:\"House property loss\",t:\"int\",m:0,w:\"17%\"},\n   {id:\"stcl\",l:\"Short term capital loss\",t:\"int\",m:0,w:\"17%\"},\n   {id:\"ltcl\",l:\"Long term capital loss\",t:\"int\",m:0,w:\"17%\"},\n   {id:\"raceLoss\",l:\"Loss from owning and maintaining race horses\",t:\"int\",m:0,w:\"19%\"}\n ]}},\n {t:\"Current year losses and totals\",f:[\n  {id:\"cyHpLoss\",l:\"House property loss of the current year remaining after set-off\",t:\"int\",m:0,w:6,ro:1,\n    hint:\"Carried from Schedule CYLA\"},\n  {id:\"cyStcl\",l:\"Short term capital loss of the current year\",t:\"int\",m:0,w:6,p:\"ScheduleCFL.LossCFFromPrev8thYearFromAY ).\n  const hpPool = oldRegime ? Math.min(hpRaw,200000) : 0;\n  const hpSpill=hpRaw-hpPool;                   // not set off, carried to CFL\n  const osPool=Math.max(-calc(\"osNet\"),0);\n\n  let hpLeft=hpPool, osLeft=osPool;\n  const cyla=HEADS.map(h=>({id:h.id,l:h.l,inc:headIncome(h),hpSet:0,osSet:0,rem:0,_h:h}));\n  cyla.forEach(r=>r.rem=r.inc);\n  // Rule 267: normal other-sources loss must be set off FIRST against race horse profit.\n  const raceRow=cyla.find(r=>r._h.id===\"osrace\");\n  if(raceRow && osLeft>0 && raceRow.rem>0){\n    const x=Math.min(osLeft,raceRow.rem); raceRow.osSet+=x; raceRow.rem-=x; osLeft-=x;\n  }\n  cyla.forEach(r=>{\n    const h=r._h;\n    if(h.hp && hpLeft>0){ const x=Math.min(hpLeft,r.rem); r.hpSet+=x; hpLeft-=x; r.rem-=x; }\n    if(h.os && osLeft>0){ const x=Math.min(osLeft,r.rem); r.osSet+=x; osLeft-=x; r.rem-=x; }\n  });\n  cyla.forEach(r=>{delete r._h});\n  const cylaTot={\n    inc:cyla.reduce((a,r)=>a+r.inc,0),\n    hpSet:cyla.reduce((a,r)=>a+r.hpSet,0),\n    osSet:cyla.reduce((a,r)=>a+r.osSet,0),\n    rem:cyla.reduce((a,r)=>a+r.rem,0)\n  };\n\n  /* ---- brought forward pools from Schedule CFL ---- */\n  let bfHp   = colTotal(\"cfl.hpLoss\");\n  let bfStcl = colTotal(\"cfl.stcl\");\n  let bfLtcl = colTotal(\"cfl.ltcl\");\n  let bfRace = colTotal(\"cfl.raceLoss\");\n\n  const bfla=cyla.map((r,i)=>{\n    const h=HEADS[i];\n    let rem=r.rem, set=0;\n    if(h.grp===\"hp\"   && bfHp>0)  { const x=Math.min(bfHp,rem);   bfHp-=x;   rem-=x; set+=x; }\n    if(h.grp===\"stcg\" && bfStcl>0){ const x=Math.min(bfStcl,rem); bfStcl-=x; rem-=x; set+=x; }\n    if(h.grp===\"ltcg\"){                              // STCL may also absorb LTCG\n      if(bfLtcl>0){ const x=Math.min(bfLtcl,rem); bfLtcl-=x; rem-=x; set+=x; }\n      if(bfStcl>0){ const x=Math.min(bfStcl,rem); bfStcl-=x; rem-=x; set+=x; }\n    }\n    if(h.grp===\"race\" && bfRace>0){ const x=Math.min(bfRace,rem); bfRace-=x; rem-=x; set+=x; }\n    return {id:r.id,l:r.l,inc:r.rem,set:set,rem:rem};\n  });\n  const bflaTot={\n    inc:bfla.reduce((a,r)=>a+r.inc,0),\n    set:bfla.reduce((a,r)=>a+r.set,0),\n    rem:bfla.reduce((a,r)=>a+r.rem,0)\n  };\n  return {cyla,cylaTot,bfla,bflaTot,\n          hpSpill:hpSpill,\n          hpUnused:hpLeft,osUnused:osLeft,\n          bfLeft:{hp:bfHp,stcl:bfStcl,ltcl:bfLtcl,race:bfRace}};\n}\n/* B(total) hook used by Schedule CFL formulas */\nfunction bflaTotal(k){\n  const r=runSetoff();\n  return k===\"total\"?r.bflaTot.set:0;\n}\n\nfunction lossGridHTML(g){\n  const R=runSetoff();\n  const cy=g.kind===\"cyla\";\n  const rows=cy?R.cyla:R.bfla;\n  const tot=cy?R.cylaTot:R.bflaTot;\n  let h='<div class=\"tw\"><table class=\"rep\"><thead><tr><th class=\"rn\">#<\u002Fth><th style=\"width:34%\">Head or source of income<\u002Fth>';\n  if(cy) h+='<th>Income of the current year<\u002Fth><th>House property loss set off<\u002Fth><th>Other sources loss set off<\u002Fth><th>Income remaining after set off<\u002Fth>';\n  else   h+='<th>Income after set off of current year losses<\u002Fth><th>Brought forward loss set off<\u002Fth><th>Income remaining after set off<\u002Fth>';\n  h+='<\u002Ftr><\u002Fthead><tbody>';\n  rows.forEach((r,i)=>{\n    const cells=cy?[r.inc,r.hpSet,r.osSet,r.rem]:[r.inc,r.set,r.rem];\n    h+='<tr><td class=\"rn\">'+(i+1)+'<\u002Ftd><td style=\"font-size:12px\">'+esc(r.l)+'<\u002Ftd>'+\n       cells.map((v,k)=>'<td class=\"num\" style=\"font-family:var(--mono);text-align:right;padding:7px 9px;font-variant-numeric:tabular-nums'+\n        (k===cells.length-1?';background:#F0F5F3;font-weight:600':'')+'\">'+inr(v)+'<\u002Ftd>').join(\"\")+'<\u002Ftr>';\n  });\n  const tc=cy?[tot.inc,tot.hpSet,tot.osSet,tot.rem]:[tot.inc,tot.set,tot.rem];\n  h+='<tr style=\"background:#EEF1F5\"><td class=\"rn\"><\u002Ftd><td style=\"font-weight:700;font-size:12px\">Total<\u002Ftd>'+\n     tc.map(v=>'<td class=\"num\" style=\"font-family:var(--mono);text-align:right;padding:7px 9px;font-weight:700\">'+inr(v)+'<\u002Ftd>').join(\"\")+ n    if(q){ if(c==='\"'){ if(txt[i+1]==='\"'){cur+='\"';i++;} else q=false; } else cur+=c; }\n    else if(c==='\"') q=true;\n    else if(c===','||c==='\\t'){ row.push(cur.trim()); cur=\"\"; }\n    else if(c==='\\n'){ row.push(cur.trim()); if(row.some(x=>x)) out.push(row); row=[]; cur=\"\"; }\n    else if(c!=='\\r') cur+=c;\n  }\n  row.push(cur.trim()); if(row.some(x=>x)) out.push(row);\n  return out;\n}\nconst HDR={\n  isin  :[/isin/i],\n  scrip :[/scrip|security|share|fund|scheme|stock|name of (the )?(share|unit|asset)/i],\n  qty   :[/quantity|units|no\\.? of (shares|units)/i],\n  sale  :[/sale (value|amount|consideration)|redemption amount|total sale|gross (sale|proceeds)/i],\n  cost  :[/cost of acquisition|purchase (value|amount|cost)|acquisition cost|buy value/i],\n  fmv   :[/fair market|fmv|31.?01.?2018|grandfather/i],\n  exp   :[/expend|transfer (charges|expenses)|brokerage|stt|charges/i],\n  dsale :[/sale date|date of (sale|redemption|transfer)|exit date/i]\n};\nfunction mapHeader(cells){\n  const m={};\n  cells.forEach((c,i)=>{\n    for(const k in HDR){ if(m[k]!=null) continue;\n      if(HDR[k].some(re=>re.test(c))){ m[k]=i; break; } }\n  });\n  return m;\n}\nconst cleanNum=s=>{const v=parseFloat(String(s||\"\").replace(/[₹,\\s]/g,\"\").replace(/^\\((.*)\\)$/,\"-$1\"));return isNaN(v)?0:v;};\nfunction normDate(s){\n  s=String(s||\"\").trim();\n  let m=s.match(/^(\\d{1,2})[\\/\\-.](\\d{1,2})[\\/\\-.](\\d{2,4})$/);\n  if(m){let y=m[3].length===2?\"20\"+m[3]:m[3];return y+\"-\"+m[2].padStart(2,\"0\")+\"-\"+m[1].padStart(2,\"0\");}\n  m=s.match(/^(\\d{4})-(\\d{2})-(\\d{2})/); if(m) return m[0];\n  return \"\";\n}\nfunction importCG(text){\n  const rows=csvRows(text);\n  if(rows.length<2) return {n:0,msg:\"No rows found in that file.\"};\n  let hi=-1,map={};\n  for(let i=0;i<Math.min(rows.length,25);i++){\n    const m=mapHeader(rows[i]);\n    if(m.scrip!=null && (m.sale!=null||m.cost!=null)){ hi=i; map=m; break; }\n  }\n  if(hi<0) return {n:0,msg:\"Could not find a header row. Expected columns naming the scrip, sale value and cost of acquisition.\"};\n  const got=[];\n  for(let i=hi+1;i<rows.length;i++){\n    const r=rows[i];\n    const scrip=(map.scrip!=null?r[map.scrip]:\"\")||\"\";\n    if(!scrip || /^total/i.test(scrip)) continue;\n    const sale=cleanNum(map.sale!=null?r[map.sale]:0);\n    const cost=cleanNum(map.cost!=null?r[map.cost]:0);\n    if(!sale && !cost) continue;\n    got.push({isin:(map.isin!=null?r[map.isin]:\"\").toUpperCase().slice(0,12),\n              scrip:scrip.slice(0,75),\n              qty:map.qty!=null?cleanNum(r[map.qty]):\"\",\n              sale:Math.round(sale),cost:Math.round(cost),\n              fmv:map.fmv!=null?Math.round(cleanNum(r[map.fmv])):\"\",\n              exp:map.exp!=null?Math.round(cleanNum(r[map.exp])):\"\",\n              dsale:map.dsale!=null?normDate(r[map.dsale]):\"\"});\n  }\n  if(!got.length) return {n:0,msg:\"Header found but no data rows could be read.\"};\n  T.s112a=got;\n  const tot=got.reduce((a,r)=>a+(r.sale-(r.cost+(r.exp||0))),0);\n  D.b3Ltcg=Math.round(tot);\n  return {n:got.length,msg:got.length+\" scrip rows loaded into Schedule 112A. Net long term gain of ₹\"+inr(Math.round(tot))+\n    \" has been written to B3. Check the fair market value column if any holding predates 1 February 2018.\",\n    cols:Object.keys(map).join(\", \")};\n}\nfunction importTDS(text){\n  const rows=csvRows(text);\n  const tan=/^[A-Z]{4}[0-9]{5}[A-Z]$/;\n  const sal=[],oth=[];\n  rows.forEach(r=>{\n    const ti=r.findIndex(c=>tan.test(String(c).trim().toUpperCase()));\n    if(ti<0) return;\n    const nums=r.map(cleanNum).filter(v=>v>0).sort((a,b)=>b-a);\n    if(nums.length<2) return;\n    const name=(r.find((c,i)=>i!==ti && /[A-Za-z]{4}/.test(c) && !tan.test(c))||\"\").slice(0,75);\n    const rec={tan:String(r[ti]).trim().toUpperCase(),name:name,gross:Math.round(nums[0]),tds:Math.round(nums[1])};\n    (/salary|92B|192/i.test(r.join(\" \"))?sal:oth).push(rec);\n  });\n  if(!sal.length && !oth.length) return {n:0,msg:\"No rows containing a valid TAN were found.\"};\n  if(sal.length) T.tds1=sal.map(x=>({t1Tan:x.tan,t1Name:x.name,t1Inc:x.gross,t1Tds:x.tds}));\n  if(oth.length) T.tds2=oth.map(x=>({t2Tan:x.tan,t2Name:x.name,t2Gross:x.gross,t2Head:\"OS\",t2Year:\"2025-26\",t2Tds:x.tds,t2Bf:0}));\n  return {n:sal.length+oth.length,\n    msg:sal.length+\" salary row(s) and \"+oth.length+\" non-salary row(s) loaded. Confirm the head of income on each non-salary row, it defaults to Other Sources.\"};\n}\nfunction importAIS(text){\n  let o; try{o=JSON.parse(text);}catch(e){return {n:0,msg:\"That file is not valid JSON.\"};}\n  const hits=[];\n  const walk=(node,path)=>{\n    if(node==null) return;\n    if(Array.isArray(node)) return node.forEach((x,i)=>walk(x,path));\n    if(typeof node===\"object\") return Object.keys(node).forEach(k=>walk(node[k],path+\"/\"+k));\n    if(typeof node===\"number\"||/^\\d[\\d,.]*$/.test(String(node))){\n      const v=cleanNum(node); if(v<=0) return;\n      const p=path.toLowerCase();\n      if(/savings/.test(p)&&/interest/.test(p)) hits.push([\"osSb\",v,\"Savings bank interest\"]);\n      else if(/deposit|term.?deposit|fixed/.test(p)&&/interest/.test(p)) hits.push([\"osFd\",v,\"Interest on deposits\"]);\n      else if(/dividend/.test(p)) hits.push([\"osDiv\",v,\"Dividend\"]);\n      else if(/refund/.test(p)&&/interest/.test(p)) hits.push([\"osItr\",v,\"Interest on income tax refund\"]);\n      else if(/salary|gross.?salary/.test(p)&&!/exempt/.test(p)) hits.push([\"sal17_1\",v,\"Salary under section 17(1)\"]);\n    }\n  };\n  walk(o,\"\");\n  if(!hits.length) return {n:0,msg:\"The file parsed but no recognisable income figures were found. AIS layouts vary, so use the CSV path or paste the rows instead.\"};\n  const agg={};\n  hits.forEach(([k,v,l])=>{agg[k]=agg[k]||{v:0,l:l}; agg[k].v+=v;});\n  const lines=Object.entries(agg).map(([k,x])=>{D[k]=Math.round(x.v);return x.l+\" — ₹\"+inr(Math.round(x.v));});\n  return {n:lines.length,msg:\"Loaded:\\n\"+lines.join(\"\\n\")+\"\\n\\nEvery figure has been written into Schedule S or Schedule OS. Check them against the statement before filing.\"};\n}\nfunction importText(text){\n  if(/[,\\t].*[,\\t]/.test(text)){\n    const a=importCG(text);\n    if(a.n) return a;\n    const b=importTDS(text);\n    if(b.n) return b;\n  }\n  return {n:0,msg:\"Could not recognise the layout. Paste rows that include a header naming the scrip, sale value and cost, or rows containing a TAN.\"};\n}\nfunction openImport(){\n  const cards=Object.entries(IMP).map(([k,v])=>\n    '<li style=\"border-left-color:var(--seal);background:#F0F5F3;cursor:pointer\" data-imp=\"'+k+'\">'+\n    '<b>'+esc(v.n)+'<\u002Fb>'+esc(v.d)+'<\u002Fli>').join(\"\");\n  drawer(\"Import from a statement\",\n   '<div class=\"bn w\" style=\"margin-bottom:12px\"><div><b>Nothing leaves this page<\u002Fb>'+\n   'Files are read in your browser. No statement, credential or figure is uploaded anywhere.<\u002Fdiv><\u002Fdiv>'+\n   '<ul class=\"vlist\" id=\"impList\">'+cards+'<\u002Ful>'+\n   '<div id=\"impArea\"><\u002Fdiv>',\n   '<span class=\"hint\" style=\"align-self:center\">After importing, always reconcile against the source before filing.<\u002Fspan>');\n}\nfunction impPanel(kind){\n  const v=IMP[kind];\n  const body=kind===\"txt\"\n   ? '<textarea id=\"impTxt\" class=\"ctl\" style=\"height:220px;font-family:var(--mono);font-size:12px\" '+\n     'placeholder=\"Paste the rows here, including the header line\"><\u002Ftextarea>'+\n     '<button class=\"btn pri\" id=\"impGo\" style=\"margin-top:10px\">Read the pasted rows<\u002Fbutton>'\n   : '<input type=\"file\" id=\"impFile\" accept=\"'+v.acc+'\" class=\"ctl\">'+\n     '<p class=\"hint\" style=\"margin-top:8px\">'+esc(v.d)+'<\u002Fp>';\n  $(\"#impArea\").innerHTML='<div class=\"sec\"><span class=\"sec-t\">'+esc(v.n)+'<\u002Fspan>'+body+'<div id=\"impOut\"><\u002Fdiv><\u002Fdiv>';\n  const run=(text)=>{\n    const r=kind===\"ais\"?importAIS(text):kind===\"cg\"?importCG(text):kind===\"tds\"?importTDS(text):importText(text);\n    $(\"#impOut\").innerHTML='<div class=\"bn '+(r.n?\"k\":\"w\")+'\" style=\"margin-top:12px\"><div><b>'+\n      (r.n?\"Imported\":\"Nothing imported\")+'<\u002Fb>'+esc(r.msg).replace(/\\n/g,\"<br>\")+'<\u002Fdiv><\u002Fdiv>';\n    if(r.n){render();toast(r.n+\" row(s) imported\");}\n  };\n  if(kind===\"txt\") $(\"#impGo\").onclick=()=>run($(\"#impTxt\").value);\n  else $(\"#impFile\").onchange=e=>{\n    const f=e.target.files[0]; if(!f) return;\n    const rd=new FileReader(); rd.onload=()=>run(rd.result); rd.readAsText(f);\n  };\n}\n\n/* ==========================================================================\n   TAX COMPUTATION ENGINE · AY 2026-27 (FY 2025-26)\n   Produces the full working, not just a number, so every figure can be traced.\n   ========================================================================== */\n\n/* ---- slab tables ---- */\nconst SLAB_NEW=[[400000,0],[800000,.05],[1200000,.10],[1600000,.15],[2000000,.20],[2400000,.25],[Infinity,.30]];\nfunction slabOld(E){ return [[E,0],[500000,.05],[1000000,.20],[Infinity,.30]]; }\nfunction slabTax(inc,bands){\n  let t=0,p=0;\n  for(const [lim,r] of bands){\n    if(inc>p){ t+=Math.max(Math.min(inc,lim)-p,0)*r; p=Math.max(lim,p); }\n    else break;\n  }\n  return t;\n}\nfunction basicExemption(){\n  if(NEW()) return 400000;                       // uniform under 115BAC\n  if(SUPER()) return 500000;\n  if(SENIOR()) return 300000;\n  return 250000;\n}\n\n/* ---- special rate buckets, taken AFTER loss set-off (post BFLA) ---- */\nfunction specialBuckets(){\n  let R; try{ R=runSetoff(); }catch(e){ R=null; }\n  const rem=id=>{ if(!R) return 0; const r=R.bfla.find(x=>x.id===id); return r?Math.max(r.rem,0):0; };\n  const vda=(G.acc&&G.acc.qvda)?G.acc.qvda.reduce((a,b)=>a+(parseFloat(b)||0),0):0;\n  const lottery=Math.max(N(\"osLottery\"),0);\n  return [\n    {k:\"stcg15\" ,l:\"Short term capital gain u/s 111A, transfer before 23 July 2024\",rate:.15,amt:rem(\"stcg15\")},\n    {k:\"stcg20\" ,l:\"Short term capital gain u/s 111A, transfer on or after 23 July 2024\",rate:.20,amt:rem(\"stcg20\")},\n    {k:\"stcg30\" ,l:\"Short term capital gain taxable at 30%\",rate:.30,amt:rem(\"stcg30\")},\n    {k:\"ltcg10\" ,l:\"Long term capital gain taxable at 10%\",rate:.10,amt:rem(\"ltcg10\"),exempt112A:true},\n    {k:\"ltcg125\",l:\"Long term capital gain taxable at 12.5%\",rate:.125,amt:rem(\"ltcg125\"),exempt112A:true},\n    {k:\"ltcg20\" ,l:\"Long term capital gain taxable at 20% with indexation\",rate:.20,amt:rem(\"ltcg20\")},\n    {k:\"vda\"    ,l:\"Virtual digital assets u/s 115BBH\",rate:.30,amt:vda},\n    {k:\"lottery\",l:\"Winnings from lotteries and games u/s 115BB\",rate:.30,amt:lottery}\n  ].filter(b=>b.amt>0);\n}\n\n/* ---- surcharge ---- */\nfunction surchargeRate(ti){\n  if(ti>50000000) return NEW()?.25:.37;\n  if(ti>20000000) return .25;\n  if(ti>10000000) return .15;\n  if(ti> 5000000) return .10;\n  return 0;\n}\nconst SUR_THRESHOLDS=[5000000,10000000,20000000,50000000];\n\n/* ==========================================================================\n   MAIN\n   ========================================================================== */\nfunction computeTax(opts){\n  opts=opts||{};\n  const forceOld = opts.regime===\"old\";\n  const forceNew = opts.regime===\"new\";\n  const _saved=D.optOut115;\n  if(forceOld) D.optOut115=\"Y\";\n  if(forceNew) D.optOut115=\"N\";\n\n  const w={lines:[],notes:[]};\n  const isNew=NEW();\n\n  /* 1. split total income into special-rate and normal-rate parts */\n  const buckets=specialBuckets();\n  const exemption112A=125000;                                  // section 112A(2) threshold\n  let left112A=exemption112A;\n  buckets.forEach(b=>{\n    b.taxable=b.amt;\n    if(b.exempt112A && left112A>0){\n      const use=Math.min(left112A,b.amt);\n      b.exemptUsed=use; b.taxable=b.amt-use; left112A-=use;\n    }\n  });\n  const specialTotal=buckets.reduce((a,b)=>a+b.amt,0);\n  const gti=C(\"gti\");\n  const via=C(\"viaTotal\");\n  const totalIncome=Math.max(gti-via,0);\n\n  // Chapter VI-A cannot be set against special-rate income (sections 111A(2) and 112A(6))\n  let normalIncome=Math.max(totalIncome-specialTotal,0);\n  if(totalIncome<specialTotal){\n    w.notes.push(\"Special rate income exceeds total income after Chapter VI-A. Normal rate income has been floored at zero.\");\n  }\n\n  /* 2. tax on normal income, with agricultural income aggregated for rate */\n  const bands=isNew?SLAB_NEW:slabOld(basicExemption());\n  const agri=Math.max(C(\"eiNetAgri\"),0);\n  let normalTax;\n  if(agri>5000 && normalIncome>basicExemption()){\n    const a=slabTax(normalIncome+agri,bands);\n    const b=slabTax(agri+basicExemption(),bands);\n    normalTax=Math.max(a-b,0);\n    w.notes.push(\"Net agricultural income of \"+money(agri)+\" has been aggregated for rate purposes and then rebated.\");\n  }else{\n    normalTax=slabTax(normalIncome,bands);\n  }\n  normalTax=Math.round(normalTax);\n\n  /* 3. tax on each special bucket */\n  let specialTax=0;\n  buckets.forEach(b=>{ b.tax=Math.round(b.taxable*b.rate); specialTax+=b.tax; });\n\n  /* 4. rebate u/s 87A — against normal-rate tax only */\n  let rebate=0, rebateNote=\"\";\n  if(IND() && (RES()||NOR())){\n    if(isNew){\n      if(totalIncome<=1200000){\n        rebate=Math.min(normalTax,60000);\n        rebateNote=\"New regime: total income is within \"+money(1200000)+\", so a rebate of up to \"+money(60000)+\" applies.\";\n      }else{\n        // marginal relief: tax on normal income cannot exceed the income above 12,00,000\n        const excess=totalIncome-1200000;\n        if(normalTax>excess){\n          rebate=normalTax-excess;\n          rebateNote=\"Marginal relief u/s 87A: total income exceeds \"+money(1200000)+\" by \"+money(excess)+\n                     \", so tax on normal income is limited to that excess.\";\n        }\n      }\n    }else{\n      if(totalIncome<=500000){\n        rebate=Math.min(normalTax,12500);\n        rebateNote=\"Old regime: total income is within \"+money(500000)+\", so a rebate of up to \"+money(12500)+\" applies.\";\n      }\n    }\n  }\n  rebate=Math.round(Math.min(rebate,normalTax));\n  const taxAfterRebate=normalTax+specialTax-rebate;\n\n  /* 5. surcharge, with the 15% cap on capital gain and dividend income */\n  const rate=surchargeRate(totalIncome);\n  let surcharge=0, marginalRelief=0;\n  if(rate>0){\n    const capRate=Math.min(rate,.15);\n    const cgTaxForCap=buckets.filter(b=>/stcg|ltcg/.test(b.k)).reduce((a,b)=>a+b.tax,0);\n    const otherTax=Math.max(normalTax+specialTax-rebate-cgTaxForCap,0);\n    surcharge=cgTaxForCap*capRate+otherTax*rate;\n    if(rate>.15 && cgTaxForCap>0)\n      w.notes.push(\"Surcharge on capital gain income is capped at 15% under the proviso to section 2 of the Finance Act.\");\n\n    /* marginal relief at the surcharge threshold */\n    const T=[...SUR_THRESHOLDS].filter(x=>totalIncome>x).pop();\n    if(T){\n      const taxAtT=slabTax(Math.max(T-specialTotal,0),bands)+specialTax;\n      const prevRate=surchargeRate(T);\n      const liabAtT=taxAtT+taxAtT*prevRate;\n      const liabNow=taxAfterRebate+surcharge;\n      if(liabNow>liabAtT+(totalIncome-T)){\n        marginalRelief=liabNow-(liabAtT+(totalIncome-T));\n        surcharge=Math.max(surcharge-marginalRelief,0);\n        w.notes.push(\"Marginal relief of \"+money(marginalRelief)+\" has been allowed on surcharge at the \"+money(T)+\" threshold.\");\n      }\n    }\n  }\n  surcharge=Math.round(surcharge);\n\n  /* 6. cess */\n  const cess=Math.round((taxAfterRebate+surcharge)*.04);\n  const grossRaw=taxAfterRebate+surcharge+cess;\n  const gross=Math.round(grossRaw/10)*10;          // section 288B, nearest ten rupees\n  if(gross!==grossRaw) w.notes.push(\"Rounded to the nearest ten rupees u/s 288B, from \"+money(grossRaw)+\".\");\n\n  /* working */\n  w.regime      = isNew?\"New regime u/s 115BAC\":\"Old regime\";\n  w.exemption   = basicExemption();\n  w.gti         = gti;\n  w.via         = via;\n  w.totalIncome = totalIncome;\n  w.specialTotal= specialTotal;\n  w.normalIncome= normalIncome;\n  w.normalTax   = normalTax;\n  w.buckets     = buckets;\n  w.specialTax  = specialTax;\n  w.rebate      = rebate;\n  w.rebateNote  = rebateNote;\n  w.surchargeRate = rate;\n  w.surcharge   = surcharge;\n  w.marginalRelief = Math.round(marginalRelief);\n  w.cess        = cess;\n  w.taxPayable  = normalTax+specialTax;\n  w.grossRaw    = Math.round(grossRaw);\n  w.gross       = gross;\n\n  if(forceOld||forceNew) D.optOut115=_saved;\n  return w;\n}\n\n/* calc() hooks so the schedule can consume the engine */\nfunction taxOut(k){\n  const t=computeTax();\n  return Math.round(t[k]||0);\n}\n\n/* ---- regime comparison, like for like ----\n   Under the new regime most Chapter VI-A deductions, the section 16(ii) and\n   16(iii) deductions and several exempt allowances fall away, and the standard\n   deduction rises to 75,000. Comparing slab tables on identical income would\n   flatter the new regime, so each side is recomputed on its own rules.        */\nfunction compareRegimes(){\n  const snap=JSON.stringify(D);\n  const snapEx=JSON.stringify(T.ex10||[]);\n  const restore=()=>{const o=JSON.parse(snap);Object.keys(D).forEach(k=>delete D[k]);Object.assign(D,o);\n                     T.ex10=JSON.parse(snapEx);};\n  const netSal=()=>Math.max(calc(\"grossSal\")-calc(\"totExempt\"),0);\n\n  D.optOut115=\"Y\";\n  D.dedStd=Math.min(50000,netSal());\n  const o=computeTax();\n  const oDetail={std:D.dedStd,via:calc(\"viaTotal\"),ti:o.totalIncome};\n  restore();\n\n  D.optOut115=\"N\";\n  VIA_OLD_ONLY.forEach(([id])=>D[id]=0);              // rule 342\n  D.dedEnt=0; D.dedProf=0;                            // rules 57 and 58\n  if(D.hpType1===\"S\") D.hpInt1=0;                     // rule 81\n  T.ex10=(T.ex10||[]).map(r=>                         // rule 54\n    /10\\(5\\)|10\\(13A\\)|10\\(14\\)\\(i\\)|10\\(14\\)\\(ii\\)|10\\(17\\)/.test(r.exNat||\"\")\n      ? Object.assign({},r,{exAmt:0}) : r);\n  D.dedStd=Math.min(75000,netSal());\n  const n=computeTax();\n  const nDetail={std:D.dedStd,via:calc(\"viaTotal\"),ti:n.totalIncome};\n  restore();\n\n  return {old:o,nw:n,oD:oDetail,nD:nDetail,\n          saving:Math.abs(o.gross-n.gross),better:o.gross<=n.gross?\"old\":\"new\"};\n}\n\n/* ---- rendering ---- */\nfunction taxWorkingHTML(){\n  const t=computeTax();\n  const cmp=compareRegimes();\n  const row=(k,v,strong,neg)=>'<tr><td style=\"padding:7px 9px;font-size:12.5px'+(strong?';font-weight:700':'')+'\">'+esc(k)+\n    '<\u002Ftd><td class=\"num\" style=\"padding:7px 9px;font-family:var(--mono);text-align:right;font-variant-numeric:tabular-nums'+\n    (strong?';font-weight:700;background:#F0F5F3':'')+(neg?';color:var(--seal)':'')+'\">'+(neg?\"−\":\"\")+inr(Math.abs(v))+'<\u002Ftd><\u002Ftr>';\n  let h='<div class=\"tw\"><table class=\"rep\"><tbody>';\n  h+=row(\"Gross total income\",t.gti);\n  h+=row(\"Less: deductions under Chapter VI-A\",t.via,false,true);\n  h+=row(\"Total income\",t.totalIncome,true);\n  h+=row(\"Of which taxed at special rates\",t.specialTotal);\n  h+=row(\"Balance taxed at slab rates\",t.normalIncome);\n  h+='<tr><td colspan=\"2\" style=\"padding:8px 9px;background:#EEF1F5;font-size:11px;font-weight:700;letter-spacing:.08em;text-transform:uppercase\">'+\n     esc(t.regime)+' · basic exemption '+money(t.exemption)+'<\u002Ftd><\u002Ftr>';\n  h+=row(\"Tax at slab rates\",t.normalTax);\n  t.buckets.forEach(b=>{\n    h+=row(\"  \"+b.l+\" @ \"+(b.rate*100)+\"%\"+(b.exemptUsed?\" (after \"+money(b.exemptUsed)+\" exempt u/s 112A)\":\"\")+\n           \" on \"+money(b.taxable),b.tax);\n  });\n  h+=row(\"Tax before rebate\",t.taxPayable,true);\n  if(t.rebate) h+=row(\"Less: rebate u/s 87A\",t.rebate,false,true);\n  if(t.surcharge||t.surchargeRate) h+=row(\"Surcharge at \"+(t.surchargeRate*100)+\"%\"+(t.marginalRelief?\" after marginal relief of \"+money(t.marginalRelie tion u/s 80DD is not allowed to a non resident\",\n f:()=>NRI()&&N(\"d80dd\")>0?\"80DD is not available to a non resident\":null},\n{n:328,cat:\"A\",s:\"via\",t:\"Deduction u/s 80DDB is claimed by a non resident\",\n f:()=>NRI()&&N(\"d80ddb\")>0?\"80DDB is not available to a non resident\":null},\n{n:329,cat:\"A\",s:\"via\",t:\"Deduction u/s 80U is claimed by a non resident\",\n f:()=>NRI()&&N(\"d80u\")>0?\"80U is not available to a non resident\":null},\n{n:317,cat:\"A\",s:\"via\",t:\"Deduction u/s 80CCD(1) is not applicable to HUF\",\n f:()=>HUF()&&N(\"d80ccd1\")>0?\"80CCD(1) is not available to an HUF\":null},\n{n:318,cat:\"A\",s:\"via\",t:\"Deduction u/s 80CCD(1B) is not allowed to HUF\",\n f:()=>HUF()&&N(\"d80ccd1b\")>0?\"80CCD(1B) is not available to an HUF\":null},\n{n:319,cat:\"A\",s:\"via\",t:\"Deduction u/s 80CCD(2) is not allowed to HUF\",\n f:()=>HUF()&&N(\"d80ccd2\")>0?\"80CCD(2) is not available to an HUF\":null},\n{n:320,cat:\"A\",s:\"via\",t:\"Deduction u/s 80E is not allowed to HUF\",\n f:()=>HUF()&&N(\"d80e\")>0?\"80E is not available to an HUF\":null},\n{n:324,cat:\"A\",s:\"via\",t:\"Deduction u/s 80U is not allowed to HUF\",\n f:()=>HUF()&&N(\"d80u\")>0?\"80U is not available to an HUF\":null},\n{n:325,cat:\"A\",s:\"via\",t:\"Deduction u/s 80EEA is not allowed to HUF\",\n f:()=>HUF()&&N(\"d80eea\")>0?\"80EEA is not available to an HUF\":null},\n{n:326,cat:\"A\",s:\"via\",t:\"Deduction u/s 80EEB is not allowed to HUF\",\n f:()=>HUF()&&N(\"d80eeb\")>0?\"80EEB is not available to an HUF\":null},\n{n:620,cat:\"A\",s:\"via\",t:\"80EE or 80EEA can be claimed only when the limit u/s 24(b) is exhausted\",\n f:()=>(N(\"d80eea\")>0)&&N(\"hpInt1\")<200000&&D.hpType1===\"S\"?\"80EEA becomes available only after the \"+money(200000)+\" limit u/s 24(b) is exhausted\":null},\n{n:759,cat:\"A\",s:\"via\",t:\"80EE and 80EEA cannot both be claimed\",\n f:()=>OLD()&&N(\"d80eea\")>0&&N(\"d80e\")>0&&false?null:null},\n{n:288,cat:\"A\",s:\"via\",t:\"80G claimed in Schedule VIA should not exceed Schedule 80G\",\n f:()=>OLD()&&N(\"d80g\")>0?\"Deduction u/s 80G is claimed. Schedule 80G with donee-wise detail is not built in this sheet and is mandatory before upload\":null},\n{n:302,cat:\"A\",s:\"via\",t:\"80D claimed in Schedule VIA requires Schedule 80D to be filled\",\n f:()=>OLD()&&N(\"d80d\")>0&&!D.s80dType?\"Deduction u/s 80D is claimed, so the coverage dropdown must be selected\":null},\n{n:291,cat:\"A\",s:\"via\",t:\"Old regime: 80D for self and family allowed to the extent of Rs.25,000\",\n f:()=>{if(!OLD()||N(\"d80d\")<=0)return null;\n   const sen=/Senior/i.test(D.s80dType||\"\");const cap=sen?100000:50000;\n   return N(\"d80d\")>cap?\"80D is capped at \"+money(cap)+\" for the coverage you have selected\":null}},\n{n:300,cat:\"A\",s:\"via\",t:\"Old regime: eligible amount of 80D should not be more than Rs.1,00,000\",\n f:()=>OLD()&&N(\"d80d\")>100000?\"80D cannot exceed \"+money(100000)+\" in aggregate\":null},\n{n:645,cat:\"A\",s:\"via\",t:\"PRAN should be provided to claim 80CCD(1) or 80CCD(1B)\",\n f:()=>(N(\"d80ccd1\")>0||N(\"d80ccd1b\")>0)&&!rows(\"nps80ccd\").length?\"A PRAN and the contribution detail must be provided to claim 80CCD(1) or 80CCD(1B)\":null},\n{n:340,cat:\"D\",s:\"via\",t:\"80QQB cannot be claimed if the return is not filed within the due date\",\n f:()=>null},\n\n/* ---------------- Schedule EI ---------------- */\n{n:435,cat:\"A\",s:\"ei\",t:\"Total exempt income should equal the sum of 1 to 5\",\n f:()=>C(\"eiTotal\")===C(\"eiNetAgri\")+N(\"eiPpf\")+N(\"eiNri\")+N(\"eiPti\")?null:\"Total exempt income does not equal the sum of its components\"},\n{n:436,cat:\"A\",s:\"ei\",t:\"Net agricultural income should equal gross receipts less expenditure less unabsorbed loss\",\n f:()=>C(\"eiNetAgri\")===N(\"eiAgri\")-N(\"eiAgriExp\")-N(\"eiAgriLoss\")?null:\"Net agricultural income does not follow from its components\"},\n{n:445,cat:\"A\",s:\"ei\",t:\"Net agricultural income above Rs.5 lakh requires details r sources loss carried into CYLA does not reconcile with Schedule OS\"}},\n{n:267,cat:\"A\",s:\"cyla\",t:\"Normal OS loss should be set off first against profit from race horses\",\n f:()=>{const R=runSetoff();const race=R.cyla.find(r=>r.id===\"osrace\");\n   const osLoss=Math.max(-C(\"osNet\"),0);\n   if(!osLoss||!race||race.inc<=0)return null;\n   return race.osSet<Math.min(osLoss,race.inc)?\"Loss under other sources must be set off against race horse profit before any other head\":null}},\n{n:266,cat:\"A\",s:\"cyla\",t:\"Total loss set off cannot be more than the loss to be set off\",\n f:()=>{const R=runSetoff();\n   return R.cylaTot.hpSet>Math.max(-C(\"hpTotal\"),0)||R.cylaTot.osSet>Math.max(-C(\"osNet\"),0)?\"Loss set off exceeds the loss available\":null}},\n{n:268,cat:\"A\",s:\"cyla\",t:\"CYLA: column 2 plus column 3 should not exceed column 1\",\n f:()=>{const R=runSetoff();const b=R.cyla.find(r=>r.hpSet+r.osSet>r.inc+0.5);\n   return b?\"Set off against \"+b.l+\" exceeds the income available\":null}},\n{n:269,cat:\"A\",s:\"cyla\",t:\"BFLA: column 2 should not exceed column 1\",\n f:()=>{const R=runSetoff();const b=R.bfla.find(r=>r.set>r.inc+0.5);\n   return b?\"Brought forward set off against \"+b.l+\" exceeds the income available\":null}},\n{n:274,cat:\"A\",s:\"cfl\",t:\"House property loss at CFL should equal the loss remaining after set off at CYLA\",\n f:()=>{const R=runSetoff();const exp=Math.round(R.hpSpill+R.hpUnused);\n   return N(\"cyHpLoss\")===exp?null:\"Current year house property loss carried forward should be \"+money(exp)}},\n{n:762,cat:\"A\",s:\"cyla\",t:\"House property loss not fully set off although income is available\",\n f:()=>{const R=runSetoff();\n   return (R.hpUnused>0&&R.cylaTot.rem>0)?\"Income is still available for set off but house property loss of \"+money(R.hpUnused)+\" has not been applied. It cannot be carried forward while income remains\":null}},\n{n:486,cat:\"A\",s:\"cfl\",t:\"Losses of current year to be carried forward should equal the CFL total\",\n f:()=>null},\n{n:748,cat:\"A\",s:\"cfl\",t:\"CFL loss carried forward restricted to zero if the computation is negative\",\n f:()=>C(\"cflCarry\")<0?\"Loss carried forward cannot be negative\":null},\n{n:26.4,cat:\"D\",s:\"cfl\",t:\"Current year losses should not be more than zero if the return is filed u/s 139(4)\",\n f:()=>{if(!LATE())return null;\n   const s=N(\"cyStcl\")+N(\"cyLtcl\")+N(\"cyHpLoss\");\n   return s>0?\"The return is belated u/s 139(4), so current year losses of \"+money(s)+\" cannot be carried forward\":null}},\n\n/* ---------------- Schedule TR, FA, AL ---------------- */\n{n:453,cat:\"A\",s:\"tr\",t:\"Schedule TR is not applicable if residential status is non resident\",\n f:()=>NRI()&&rows(\"tr1\").length?\"Schedule TR does not apply to a non resident\":null},\n{n:451,cat:\"A\",s:\"tr\",t:\"Relief u/s 90 or 90A should match the rows where that section is selected\",\n f:()=>{const s=rows(\"tr1\").filter(r=>/^90/.test(r.trSec||\"\")).reduce((a,r)=>a+(+r.trAvail||0),0);\n   return N(\"trDtaa\")&&Math.abs(N(\"trDtaa\")-s)>1?\"Relief where a DTAA applies should be \"+money(s):null}},\n{n:452,cat:\"A\",s:\"tr\",t:\"Relief u/s 91 should match the rows where section 91 is selected\",\n f:()=>{const s=rows(\"tr1\").filter(r=>r.trSec===\"91\").reduce((a,r)=>a+(+r.trAvail||0),0);\n   return N(\"trNoDtaa\")&&Math.abs(N(\"trNoDtaa\")-s)>1?\"Relief where no DTAA applies should be \"+money(s):null}},\n{n:456,cat:\"A\",s:\"al\",t:\"Schedule AL should be filled if total income is greater than Rs.1 crore\",\n f:()=>{const ti=C(\"totalIncome\");\n   if(ti<=10000000)return null;\n   const any=rows(\"alA\").length||C(\"alMovable\")>0;\n   return any?null:\"Total income of \"+money(ti)+\" exceeds \"+money(10000000)+\", so Schedule AL is mandatory\"}},\n\n/* ---------------- TDS, TCS, tax payments ---------------- */\n{n:463,cat:\"A\",s:\"tds\",t:\"TDS claimed cannot be more than the gross income disclosed\",\n f:()=>{const b=rows(
