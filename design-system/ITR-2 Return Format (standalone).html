A\",s:\"tti\",t:\"Income under House Property in Part B-TI should equal Schedule HP\",\n f:()=>C(\"tiHp\")===C(\"hpTotal\")?null:\"House property in Part B-TI does not match Schedule HP\"},\n{n:506,cat:\"A\",s:\"tti\",t:\"Total income should equal gross total income less Chapter VI-A deductions\",\n f:()=>C(\"totalIncome\")===Math.max(C(\"gti\")-C(\"viaTotal\"),0)?null:\"Total income does not equal gross total income less Chapter VI-A deductions\"},\n{n:509,cat:\"A\",s:\"tti\",t:\"Chapter VI-A in Part B-TI should be the lower of Schedule VI-A or gross total income\",\n f:()=>C(\"viaTotal\")===Math.min(C(\"viaRaw\"),Math.max(C(\"gti\"),0))?null:\"Chapter VI-A deduction is not restricted to the lower of the schedule total or gross total income\"},\n{n:487,cat:\"A\",s:\"tti\",t:\"Tax computation should not be more than zero if gross total income is nil\",\n f:()=>C(\"gti\")<=0&&num(\"xTax\")>0?\"Gross total income is nil, so no tax can be payable\":null},\n{n:508,cat:\"A\",s:\"tti\",t:\"Net agricultural income for rate purposes should equal Schedule EI\",\n f:()=>null},\n{n:525,cat:\"A\",s:\"tti\",t:\"Gross tax liability should equal tax payable plus surcharge plus cess\",\n f:()=>C(\"grossTax\")===num(\"xTax\")+num(\"xSur\")+num(\"xCess\")?null:\"Gross tax liability does not equal tax payable plus surcharge plus cess\"},\n{n:524,cat:\"A\",s:\"tti\",t:\"Tax payable should equal tax on total income less rebate u/s 87A\",\n f:()=>num(\"xReb\")>num(\"xTax\")?\"Rebate u/s 87A cannot exceed the tax payable on total income\":null},\n{n:484,cat:\"A\",s:\"tti\",t:\"Total income above Rs.12,00,000 cannot claim rebate u/s 87A\",\n f:()=>NEW()&&C(\"totalIncome\")>1200000&&num(\"xReb\")>0?\"Under the new regime the rebate u/s 87A is not available once total income exceeds \"+money(1200000):null},\n{n:485,cat:\"A\",s:\"tti\",t:\"Old regime: rebate u/s 87A should not be more than Rs.12,500\",\n f:()=>OLD()&&num(\"xReb\")>12500?\"Under the old regime the rebate u/s 87A is capped at \"+money(12500):null},\n{n:535,cat:\"A\",s:\"tti\",t:\"Old regime: total income above Rs.5 lakh cannot claim rebate u/s 87A\",\n f:()=>OLD()&&(RES()||NOR())&&C(\"totalIncome\")>500000&&num(\"xReb\")>0?\"Under the old regime the rebate u/s 87A is not available once total income exceeds \"+money(500000):null},\n{n:533,cat:\"A\",s:\"tti\",t:\"Rebate u/s 87A is not allowed to a non resident\",\n f:()=>NRI()&&num(\"xReb\")>0?\"The rebate u/s 87A is not available to a non resident\":null},\n{n:534,cat:\"A\",s:\"tti\",t:\"Rebate u/s 87A is not allowed to HUF\",\n f:()=>HUF()&&num(\"xReb\")>0?\"The rebate u/s 87A is not available to an HUF\":null},\n{n:528,cat:\"A\",s:\"tti\",t:\"Total tax relief should equal relief u/s 89 plus 90/90A plus 91\",\n f:()=>C(\"totRelief\")===N(\"rel89\")+N(\"rel90\")+N(\"rel91\")?null:\"Total tax relief does not equal the sum of its components\"},\n{n:516,cat:\"A\",s:\"tti\",t:\"HUF cannot claim relief u/s 89\",\n f:()=>HUF()&&N(\"rel89\")>0?\"An HUF cannot claim relief u/s 89\":null},\n{n:542,cat:\"A\",s:\"tti\",t:\"Relief u/s 89 cannot be claimed if salary details are zero or blank\",\n f:()=>N(\"rel89\")>0&&C(\"salChargeable\")<=0?\"Relief u/s 89 requires salary income to be disclosed\":null},\n{n:526,cat:\"A\",s:\"tti\",t:\"Relief u/s 90 or 90A in Part B-TTI should equal the amount in Schedule TR\",\n f:()=>{if(!rows(\"tr1\").length)return null;\n   return Math.abs(N(\"rel90\")-N(\"trDtaa\"))>1?\"Relief u/s 90 or 90A of \"+money(N(\"rel90\"))+\" does not match Schedule TR\":null}},\n{n:527,cat:\"A\",s:\"tti\",t:\"Relief u/s 91 in Part B-TTI should equal the amount in Schedule TR\",\n f:()=>{if(!rows(\"tr1\").length)return null;\n   return Math.abs(N(\"rel91\")-N(\"trNoDtaa\"))>1?\"Relief u/s 91 of \"+money(N(\"rel91\"))+\" does not match Schedule TR\":null}},\n{n:529,cat:\"A\",s:\"tti\",t:\"Total interest and fee should equal 234A + 234B + 234C + 234F + 234-I\",\n f:()=>C(\"totInterest\")===N(\"int234a\")+N(\"int234b\")+N(\"int234c\")+N(\"fee234f\")+N(\"fee234i\")?null:\"Total interest and fee does not equal the sum of its components\"},\n{n:530,cat:\"A\",s:\"tti\",t:\"Aggregate liability should equal net tax liability plus total interest payable\",\n f:()=>C(\"aggLiab\")===C(\"netTax\")+C(\"totInterest\")?null:\"Aggregate liability does not equal net tax plus interest\"},\n{n:531,cat:\"A\",s:\"tti\",t:\"Total taxes paid should equal advance tax, TDS, TCS and self assessment tax\",\n f:()=>C(\"taxesPaid\")===C(\"advTax\")+C(\"selfAsmt\")+C(\"tdsTotal\")?null:\"Total taxes paid does not reconcile with the advance and self assessment split\"},\n{n:536,cat:\"A\",s:\"tti\",t:\"Refund should equal the difference between taxes paid and aggregate liability\",\n f:()=>C(\"refund\")===Math.max(C(\"taxesPaid\")-C(\"aggLiab\"),0)?null:\"Refund does not equal taxes paid less aggregate liability\"},\n{n:537,cat:\"A\",s:\"tti\",t:\"Tax payable should equal the difference between aggregate liability and taxes paid\",\n f:()=>C(\"balDue\")===Math.max(C(\"aggLiab\")-C(\"taxesPaid\"),0)?null:\"Amount payable does not equal aggregate liability less taxes paid\"},\n{n:694,cat:\"A\",s:\"tti\",t:\"Fee u/s 234-I is Rs.1,000 for a revised return after 31/12/2026 where income is up to Rs.5 lakh\",\n f:()=>null},\n{n:520,cat:\"A\",s:\"tti\",t:\"Self assessment tax should equal challans deposited after 31/03/2026\",\n f:()=>C(\"selfAsmt\")===chalSplit().self?null:\"The self assessment tax figure does not match the challans dated after 31 March 2026\"},\n{n:521,cat:\"A\",s:\"tti\",t:\"Advance tax should equal challans deposited during the previous year\",\n f:()=>C(\"advTax\")===chalSplit().adv?null:\"The advance tax figure does not match the challans dated within the previous year\"},\n{n:532,cat:\"A\",s:\"tti\",t:\"IFSC under bank details should match the RBI database\",\n f:()=>{const b=rows(\"bank\").find(r=>r.bIfsc&&!/^[A-Z]{4}0[A-Z0-9]{6}$/.test(String(r.bIfsc).toUpperCase()));\n   return b?\"IFSC \"+b.bIfsc+\" is not in the valid format of four letters, a zero and six characters\":null}},\n{n:662,cat:\"A\",s:\"tti\",t:\"CGAS bank account details must be present where a capital gains account is used\",\n f:()=>{const dep=rows(\"cgex\").some(r=>(+r.exDep||0)>0);\n   if(!dep)return null;\n   return rows(\"bank\").some(r=>r.bType===\"CGAS\")?null:\"An amount is deposited in the Capital Gains Account Scheme, so a CGAS bank account must be listed\"}},\n{n:538,cat:\"A\",s:\"tti\",t:\"Income details and tax computation must be disclosed where taxes paid are disclosed\",\n f:()=>C(\"taxesPaid\")>0&&C(\"gti\")<=0?\"Taxes paid are disclosed but no income has been offered\":null},\n\n/* ---------------- Verification ---------------- */\n{n:8,cat:\"A\",s:\"ver\",t:\"PAN in Schedule Verification must match the PAN uploading the return\",\n f:()=>{if(D.repFlag===\"Y\")return null;\n   return D.vPan&&D.pan&&D.vPan!==D.pan?\"The PAN in Verification does not match the PAN in Part A General\":null}},\n\n/* ---------------- Category D advisories ---------------- */\n{n:\"D3\",cat:\"D\",s:\"tr\",t:\"Form 67 is mandatory where relief u/s 90 or 91 is claimed\",\n f:()=>(N(\"rel90\")>0||N(\"rel91\")>0)?\"Relief u/s 90, 90A or 91 is claimed. Form 67 must be filed separately or the relief may be disallowed\":null},\n{n:\"D5\",cat:\"D\",s:\"tti\",t:\"Form 10E is required to claim relief u/s 89\",\n f:()=>N(\"rel89\")>0?\"Relief u/s 89 is claimed. Form 10E must be filed separately or the relief may be disallowed\":null},\n{n:\"D6\",cat:\"D\",s:\"via\",t:\"Form 10BA is required to claim deduction u/s 80GG\",\n f:()=>N(\"d80gg\")>0?\"Deduction u/s 80GG is claimed. Form 10BA must be filed separately\":null},\n{n:\"D19\",cat:\"D\",s:\"sal\",t:\"Form 10EE should be filed with income claimed for relief u/s 89A\",\n f:()=>N(\"sal89A\")>0?\"Income u/s 89A is reported. Form 10EE must be filed separately\":null},\n{n:\"D20\",cat:\"D\",s:\"gen\",t:\"Refund above Rs.50 crore requires the LEI number and validity date\",\n f:()=>C(\"refund\")>500000000&&!(D.lei&&D.leiDate)?\"The refund exceeds \"+money(500000000)+\", so the LEI number and its validity date are mandatory\":null},\n{n:\"D8\",cat:\"D\",s:\"cgfull\",t:\"Residents cannot take a DTAA rate benefit; claim relief under Schedule TR and FSI\",\n f:()=>(RES()&&(N(\"a9Dtaa\")>0||N(\"b9Dtaa\")>0))?\"A resident cannot take a DTAA rate benefit in Schedule CG. Claim the relief through Schedule TR and FSI instead\":null},\n{n:\"D23\",cat:\"D\",s:\"gen\",t:\"Linking of Aadhaar and PAN is required per Circular 03/2023\",\n f:()=>!D.aadhaar&&!D.aadhaarEnrol?\"Quoting Aadhaar is required u/s 139AA. Enter the Aadhaar number or the enrolment id\":null},\n{n:619,cat:\"D\",s:\"via\",t:\"Form 10-IA must be filed separately to claim 80U and 80DD\",\n f:()=>(N(\"d80u\")>0||N(\"d80dd\")>0)?\"Deduction u/s 80U or 80DD is claimed. Form 10-IA must be filed separately\":null},\n{n:\"D1\",cat:\"D\",s:\"tti\",t:\"Form 29C is mandatory where AMT exceeds normal tax\",\n f:()=>null}\n];\n\n/* ---------- helpers used by the rules ---------- */\nfunction fvc50c(fvc,stamp){                       // rules 175 and 176, 110% safe harbour\n  if(!fvc&&!stamp) return 0;\n  return stamp<=1.10*fvc ? fvc : stamp;\n}\nfunction c112a(r){                                // rules 84 to 89, section 55(2)(ac) grandfathering\n  const qty=+r.qty||0, sp=+r.sprice||0, fmvu=+r.fmvu||0;\n  const sale=(+r.sale||0) || Math.round(qty*sp);\n  const cost=+r.cost||0;                          // col 8, actual cost\n  const fmv=(+r.fmv||0) || Math.round(qty*fmvu);  // col 11\n  const after=r.acq===\"A\";                        // acquired after 31.01.2018\n  const col9=after?0:Math.min(sale,fmv);          // col 9, lower of sale value and FMV\n  const col7=after?cost:Math.max(cost,col9);      // col 7, higher of col 8 and col 9\n  const exp=+r.exp||0;                            // col 12\n  const ded=col7+exp;                             // col 13\n  return {sale:sale,fmv:fmv,col9:col9,col7:col7,ded:ded,bal:sale-ded};\n}\nfunction chalSplit(){                             // rules 520 and 521\n  let adv=0,self=0;\n  rows(\"chal\").forEach(r=>{\n    const d=r.depDate?new Date(r.depDate):null, a=+r.chAmt||0;\n    if(!d||isNaN(d)){adv+=a;return}\n    if(d>new Date(\"2026-03-31\")) self+=a; else adv+=a;\n  });\n  return {adv:adv,self:self};\n}\n\n/* ---------- runner ---------- */\nfunction runCBDT(){\n  const out=[];\n  RULES.forEach(r=>{\n    let m=null;\n    try{ m=r.f(); }catch(e){ m=null; }\n    if(m) out.push({n:r.n,cat:r.cat,s:r.s,t:r.t,m:m});\n  });\n  out.sort((a,b)=>(a.cat===b.cat?0:a.cat===\"A\"?-1:1)||0);\n  return out;\n}\n\n/* ================= state ================= */\nconst D={};            // scalar field values\nconst T={};            // table values: T[tableId] = [ {col:val}, ... ]\nconst G={};            // quarterly grid: G[gridId][rowId] = [q1..q5]\nlet ACTIVE=SCHEMA[0].id;\nconst FMAP={};         // fieldId -> field def\nconst CMAP={};         // calcId  -> calc def\nconst TMAP={};         // tableId -> table def\nconst GMAP={};         // gridId  -> grid def\n\nSCHEMA.forEach(sc=>sc.sec.forEach(s=>{\n  (s.f||[]).forEach(f=>FMAP[f.id]=f);\n  (s.calc||[]).forEach(c=>CMAP[c.id]=c);\n  if(s.tbl){TMAP[s.tbl.id]=s.tbl; T[s.tbl.id]=Array.from({length:s.tbl.rows||1},()=>({}));}\n  if(s.gridq){GMAP[s.gridq.id]=s.gridq; G[s.gridq.id]={}; s.gridq.rows.forEach(r=>G[s.gridq.id][r.id]=[0,0,0,0,0]);}\n}));\n\nconst $=(q,r)=>(r||document).querySelector(q);\nconst $$=(q,r)=>[...(r||document).querySelectorAll(q)];\nconst esc=s=>String(s??\"\").replace(/[&<>\"']/g,c=>({\"&\":\"&amp;\",\"<\":\"&lt;\",\">\":\"&gt;\",'\"':\"&quot;\",\"'\":\"&#39;\"}[c]));\nconst inr=n=>(n||0).toLocaleString(\"en-IN\");\n\n/* ================= calc engine ================= */\nconst TAXVARS={xTax:\"taxPayable\",xSur:\"surcharge\",xCess:\"cess\",xReb:\"rebate\"};\nfunction round10(x){return Math.round((x||0)/10)*10;}\nfunction num(id){\n  if(id in TAXVARS){\n    if(D.taxOverride===\"Y\"){\n      const m={xTax:\"taxPayable\",xSur:\"surcharge\",xCess:\"cess\",xReb:\"rebate87a\"};\n      return parseFloat(D[m[id]])||0;\n    }\n    try{ return taxOut(TAXVARS[id]); }catch(e){ return 0; }\n  }\n  if(id in D) return parseFloat(D[id])||0;\n  if(CMAP[id]) return calc(id);\n  return 0;\n}\nfunction gridTotal(gid){\n  const g=G[gid]||{};\n  return Object.values(g).reduce((a,arr)=>a+arr.reduce((x,y)=>x+(parseFloat(y)||0),0),0);\n}\nfunction colTotal(ref){                       // T(tableId.colId)\n  const [t,c]=ref.split(\".\");\n  return (T[t]||[]).reduce((a,r)=>a+(parseFloat(r[c])||0),0);\n}\nconst _seen=new Set();\nfunction calc(id){\n  const c=CMAP[id]; if(!c) return 0;\n  if(_seen.has(id)) return 0;               // cycle guard\n  _seen.add(id);\n  let v=0;\n  try{\n    const expr=c.e\n      .replace(/T\\(([A-Za-z0-9_.]+)\\)/g,(m,r)=>\"(\"+colTotal(r)+\")\")\n      .replace(/Q\\(([A-Za-z0-9_]+)\\)/g,(m,r)=>\"(\"+gridTotal(r)+\")\")\n      .replace(/B\\(([A-Za-z0-9_]+)\\)/g,(m,r)=>\"(\"+bflaTotal(r)+\")\")\n      .replace(/S\\(([A-Za-z0-9_]+)\\)/g,(m,r)=>\"(\"+(chalSplit()[r]||0)+\")\")\n      .replace(/\\bR10\\(/g,\"round10(\").replace(/\\bMIN\\(/g,\"Math.min(\").replace(/\\bMAX\\(/g,\"Math.max(\").replace(/\\bR\\(/g,\"Math.round(\")\n      .replace(/\\b([A-Za-z_][A-Za-z0-9_]*)\\b/g,(m)=>{\n        if([\"Math\",\"min\",\"max\",\"round\",\"round10\"].includes(m)) return m;\n        return \"num('\"+m+\"')\";\n      });\n    v=Math.round(eval(expr))||0;\n  }catch(e){v=0}\n  _seen.delete(id);\n  return v;\n}\n\n/* ================= validation ================= */\nfunction visible(f){\n  if(!f.dep) return true;\n  const [k,v]=f.dep.split(\"=\");\n  return D[k]===v;\n}\nfunction checkOne(f,val,where){\n  const v=(val??\"\").toString().trim();\n  if(f.m && !v) return \"Required\";\n  if(!v) return \"\";\n  if(f.re && !new RegExp(f.re).test(v)) return \"Format is not valid\";\n  if(f.mx && v.length>f.mx) return \"Maximum \"+f.mx+\" characters\";\n  if(f.t===\"email\" && !/^[^@\\s]+@[^@\\s]+\\.[^@\\s]+$/.test(v)) return \"Enter a valid email address\";\n  if(f.t===\"int\"||f.t===\"dec\"){\n    const n=parseFloat(v);\n    if(isNaN(n)) return \"Enter a number\";\n    if(f.t===\"int\" && !Number.isInteger(n)) return \"Whole number only\";\n    if(f.mn!=null && n<f.mn) return \"Cannot be below \"+f.mn;\n    if(f.mx2!=null && n>f.mx2) return \"Cannot exceed \"+inr(f.mx2);\n  }\n  if(f.t===\"date\"){\n    const d=new Date(v);\n    if(isNaN(d)) return \"Enter a valid date\";\n    if(f.id===\"dob\" && d>new Date()) return \"Date of birth cannot be in the future\";\n  }\n  return \"\";\n}\nfunction validateAll(){\n  const errs=[];\n  SCHEMA.forEach(sc=>{\n    sc.sec.forEach(s=>{\n      (s.f||[]).forEach(f=>{\n        if(!visible(f)) return;\n        const e=checkOne(f,D[f.id]);\n        if(e) errs.push({sc:sc.id,scn:sc.name,fid:f.id,l:f.l,e});\n      });\n      if(s.tbl){\n        const rows=T[s.tbl.id]||[];\n        rows.forEach((r,i)=>{\n          const touched=s.tbl.cols.some(c=>(r[c.id]??\"\")!==\"\");\n          if(!touched && i>0) return;\n          if(!touched && i===0 && !s.tbl.reqd) return;\n          s.tbl.cols.forEach(c=>{\n            const e=checkOne(c,r[c.id]);\n            if(e) errs.push({sc:sc.id,scn:sc.name,fid:s.tbl.id+\"_\"+i+\"_\"+c.id,l:s.tbl.t+\" · row \"+(i+1)+\" · \"+c.l,e});\n          });\n        });\n      }\n    });\n  });\n  return errs;\n}\nfunction schedStat(sc){\n  let req=0,fill=0,bad=0;\n  sc.sec.forEach(s=>{\n    (s.f||[]).forEach(f=>{\n      if(!visible(f)) return;\n      if(f.m){req++; if((D[f.id]??\"\")!==\"\") fill++;}\n      if(checkOne(f,D[f.id])) bad++;\n    });\n    if(s.tbl) (T[s.tbl.id]||[]).forEach((r,i)=>{\n      const touched=s.tbl.cols.some(c=>(r[c.id]??\"\")!==\"\");\n      if(!touched) return;\n      s.tbl.cols.forEach(c=>{ if(c.m){req++; if((r[c.id]??\"\")!==\"\") fill++;} if(checkOne(c,r[c.id])) bad++;});\n    });\n  });\n  return {req,fill,bad};\n}\n\n/* ================= rendering ================= */\nfunction optList(o){\n  if(Array.isArray(o)) return o.map(x=>Array.isArray(x)?x:[x,x]);\n  const raw=OPT[o]||[];\n  return raw.filter(x=>x!==\"(Select)\").map(x=>[x,x]);\n}\nfunction afBtn(af){\n  const s=SRC[af];\n  if(!af||!s) return '<button type=\"button\" class=\"af\" data-src=\"\" title=\"No external source\" tabindex=\"-1\">⟳<\u002Fbutton>';\n  return '<button type=\"button\" class=\"af\" data-af=\"'+af+'\" aria-label=\"Auto-fetch from '+esc(s.n)+'\">⟳'+\n    '<span class=\"tip\"><b>Auto-fetch<\u002Fb>'+esc(s.n)+' — '+esc(s.w)+'<\u002Fspan><\u002Fbutton>';\n}\nfunction ctl(f,val,inTable){\n  const id=inTable?\"\":' id=\"in_'+f.id+'\"';\n  const cls=\"ctl\"+((f.t===\"int\"||f.t===\"dec\")?\" num\":\"\");\n  const v=esc(val??\"\");\n  if(f.t===\"sel\"){\n    let h='<select class=\"'+cls+'\"'+id+' data-fid=\"'+f.id+'\"><option value=\"\">(Select)<\u002Foption>';\n    optList(f.o).forEach(([k,l])=>{h+='<option value=\"'+esc(k)+'\"'+(String(val)===String(k)?\" selected\":\"\")+'>'+esc(l)+'<\u002Foption>';});\n    return h+'<\u002Fselect>';\n  }\n  const type=f.t===\"date\"?\"date\":(f.t===\"int\"||f.t===\"dec\")?\"number\":(f.t===\"email\"?\"email\":\"text\");\n  const step=f.t===\"dec\"?' step=\"0.01\"':(f.t===\"int\"?' step=\"1\"':\"\");\n  return '<input class=\"'+cls+'\"'+id+' data-fid=\"'+f.id+'\" type=\"'+type+'\" value=\"'+v+'\"'+step+(f.ro?' readonly':'')+\n         (f.mx?' maxlength=\"'+f.mx+'\"':\"\")+(f.up?' style=\"text-transform:uppercase\"':\"\")+\n         (f.t===\"int\"||f.t===\"dec\"?' inputmode=\"numeric\"':\"\")+' placeholder=\"'+esc(f.hint&&f.t!==\"date\"?\"\":\"\")+'\">';\n}\nfunction fieldHTML(f,rno){\n  if(!visible(f)) return \"\";\n  const err=checkOne(f,D[f.id]), bad=err&&(D[f.id]??\"\")!==\"\";\n  return '<tr class=\"rr '+(f.m?\"M\":\"O\")+(bad?\" bad\":\"\")+'\" data-wrap=\"'+f.id+'\">'+\n    '<td class=\"rno\">'+esc(rno||\"\")+'<\u002Ftd>'+\n    '<td class=\"rlb\"><label class=\"lb\" for=\"in_'+f.id+'\">'+esc(f.l)+\n      (f.m?'<span class=\"req\" title=\"Mandatory\">*<\u002Fspan>':'')+'<\u002Flabel>'+\n      (f.p?'<span class=\"tag\">'+esc(f.p)+'<\u002Fspan>':\"\")+\n      (f.hint?'<span class=\"hint\">'+esc(f.hint)+'<\u002Fspan>':\"\")+\n      '<span class=\"err\" data-err=\"'+f.id+'\">'+esc(bad?err:\"\")+'<\u002Fspan><\u002Ftd>'+\n    '<td class=\"rin\"><div class=\"ib'+(f.af?\"\":\" solo\")+'\">'+ctl(f,D[f.id])+(f.af?afBtn(f.af):\"\")+'<\u002Fdiv><\u002Ftd><\u002Ftr>';\n}\nfunction tableHTML(tb){\n  if(!T[tb.id]||!T[tb.id].length) T[tb.id]=[{}];   // never render an empty table\n  const rows=T[tb.id];\n  let h='<div class=\"sec\"><span class=\"sec-t\">'+esc(tb.t)+'<\u002Fspan><div class=\"tw\"><table class=\"rep\"><thead><tr><th class=\"rn\">#<\u002Fth>';\n  tb.cols.forEach(c=>{h+='<th style=\"width:'+(c.w||\"auto\")+'\">'+esc(c.l)+(c.m?'<span class=\"req\">*<\u002Fspan>':'<span class=\"optd\">•<\u002Fspan>')+'<\u002Fth>';});\n  h+='<\u002Ftr><\u002Fthead><tbody>';\n  rows.forEach((r,i)=>{\n    h+='<tr><td class=\"rn\">'+(i+1)+'<\u002Ftd>';\n    tb.cols.forEach(c=>{\n      if(c.cf){\n        const v=cellCalc(c.cf,r);\n        h+='<td class=\"num\" style=\"font-family:var(--mono);text-align:right;padding:8px;background:#F0F5F3;font-weight:600\">'+inr(v)+'<\u002Ftd>';\n        return;\n      }\n      const err=checkOne(c,r[c.id]);\n      h+='<td'+(err&&(r[c.id]??\"\")!==\"\"?' style=\"background:var(--mand-bg)\"':\"\")+'>'+\n        '<div class=\"ib'+(c.af?\"\":\" solo\")+'\">'+\n        ctl(Object.assign({},c,{id:c.id}),r[c.id],true).replace('data-fid=\"'+c.id+'\"','data-tbl=\"'+tb.id+'\" data-row=\"'+i+'\" data-col=\"'+c.id+'\"')+\n        (c.af?afBtn(c.af):\"\")+'<\u002Fdiv><\u002Ftd>';\n    });\n    h+='<\u002Ftr>';\n  });\n  h+='<\u002Ftbody><\u002Ftable><\u002Fdiv><div class=\"tbar\">'+\n     '<button type=\"button\" class=\"mini\" data-addrow=\"'+tb.id+'\">Add row<\u002Fbutton>'+\n     (rows.length>1?'<button type=\"button\" class=\"mini dgr\" data-delrow=\"'+tb.id+'\">Remove last row<\u002Fbutton>':\"\")+\n     '<span class=\"hint\" style=\"align-self:center\">'+rows.length+' of '+(tb.max||99)+' rows<\u002Fspan><\u002Fdiv><\u002Fdiv>';\n  return h;\n}\nfunction gridHTML(g){\n  let h='<div class=\"sec\"><span class=\"sec-t\">Quarterly break-up<\u002Fspan><div class=\"tw\"><table class=\"rep\"><thead><tr>'+\n        '<th style=\"width:34%\">Nature of capital gain<\u002Fth>';\n  g.cols.forEach(c=>{h+='<th style=\"width:12%\">'+esc(c)+'<\u002Fth>';});\n  h+='<th style=\"width:14%\">Row total<\u002Fth><\u002Ftr><\u002Fthead><tbody>';\n  g.rows.forEach(r=>{\n    const arr=G[g.id][r.id];\n    const rt=arr.reduce((a,b)=>a+(parseFloat(b)||0),0);\n    h+='<tr><td style=\"font-size:12px\">'+esc(r.l)+(r.p?'<span class=\"tag\">'+esc(r.p)+'<\u002Fspan>':'')+'<\u002Ftd>';\n    arr.forEach((v,i)=>{h+='<td><input class=\"ctl num\" type=\"number\" inputmode=\"numeric\" data-grid=\"'+g.id+\n      '\" data-gr=\"'+r.id+'\" data-gq=\"'+i+'\" value=\"'+esc(v||'')+'\"><\u002Ftd>';});\n    h+='<td class=\"num\" style=\"font-family:var(--mono);padding:8px;font-weight:600;background:#F0F5F3;text-align:right\">'+inr(rt)+'<\u002Ftd><\u002Ftr>';\n  });\n  const gt=gridTotal(g.id);\n  h+='<\u002Ftbody><\u002Ftable><\u002Fdiv><div class=\"calc\"><span class=\"k\">Total across all quarters<\u002Fspan><span class=\"v\" data-gtot=\"'+g.id+'\">₹ '+inr(gt)+'<\u002Fspan><\u002Fdiv><\u002Fdiv>';\n  return h;\n}\nfunction cellCalc(ref,row){\n  try{\n    const [fn,key]=ref.split(\".\");\n    if(fn===\"c112a\") return Math.round(c112a(row)[key]||0);\n  }catch(e){}\n  return 0;\n}\nfunction calcHTML(list){\n  return list.map(c=>'<div class=\"calc\"><span class=\"k\">'+esc(c.l)+\n    (c.p?'<span class=\"tag\" style=\"color:#5E8C82\">'+esc(c.p)+'<\u002Fspan>':\"\")+\n    '<\u002Fspan><span class=\"v\" data-calc=\"'+c.id+'\">₹ '+inr(calc(c.id))+'<\u002Fspan><\u002Fdiv>').join(\"\");\n}\nfunction render(){\n  const sc=SCHEMA.find(s=>s.id===ACTIVE);
