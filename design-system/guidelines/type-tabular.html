<!-- @dsCard group="Type" viewport="700x180" name="Tabular figures in a column" subtitle="One advance width per glyph, so rupee amounts align without CSS gymnastics" -->
<!DOCTYPE html><html lang="en"><head><meta charset="utf-8"><link rel="stylesheet" href="../styles.css">
<style>body{margin:0;padding:16px;background:var(--surface);font-family:var(--font-ui)}.two{display:grid;grid-template-columns:1fr 1fr;gap:24px}.col{display:flex;flex-direction:column}.h{font-size:11px;font-family:var(--font-figure);color:var(--neutral-500);margin-bottom:6px}.row{display:flex;justify-content:space-between;padding:4px 0;font-size:15px}.amt{font-family:var(--font-figure);font-variant-numeric:tabular-nums lining-nums}.bad .amt{font-family:var(--font-ui);font-variant-numeric:normal}</style>
</head><body>
<div class="two"><div class="col"><span class="h">DO — Plex Mono, tabular</span><div class="row"><span>Gross salary</span><span class="amt">14,80,000</span></div><div class="row"><span>Other sources</span><span class="amt">42,318</span></div><div class="row"><span>Total income</span><span class="amt">14,47,320</span></div><div class="row"><span>Refund due</span><span class="amt">8,557</span></div></div><div class="col bad"><span class="h">DON'T — proportional sans in a column</span><div class="row"><span>Gross salary</span><span class="amt">14,80,000</span></div><div class="row"><span>Other sources</span><span class="amt">42,318</span></div><div class="row"><span>Total income</span><span class="amt">14,47,320</span></div><div class="row"><span>Refund due</span><span class="amt">8,557</span></div></div></div>
</body></html>
