</head><body>
<div class="grid"><div class="sw" style="background:#141C29;color:var(--surface)"><span class="n">ink</span><span class="h">#141C29 · Mast ink</span></div><div class="sw" style="background:#1B5E9C;color:var(--surface)"><span class="n">primary</span><span class="h">#1B5E9C · Opt blue</span></div><div class="sw" style="background:#0D6B5B;color:var(--surface)"><span class="n">credit / seal</span><span class="h">#0D6B5B · Seal CTA</span></div><div class="sw" style="background:#9A6212;color:var(--surface)"><span class="n">due</span><span class="h">#9A6212 · Filing amber</span></div><div class="sw" style="background:#B3261E;color:var(--surface)"><span class="n">notice</span><span class="h">#B3261E · Notice red</span></div><div class="sw" style="background:#F5F6F8;color:var(--ink)"><span class="n">paper</span><span class="h">#F5F6F8 · Cool paper</span></div><div class="sw" style="background:#FFFFFF;color:var(--ink);border-color:#D9DEE6"><span class="n">surface</span><span class="h">#FFFFFF · Sheet</span></div></div>
