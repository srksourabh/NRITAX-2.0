<!-- @dsCard group="Brand" viewport="700x180" name="Interaction states" subtitle="Focus ring, hover, disabled, error — no lift, no scale" -->
<!DOCTYPE html><html lang="en"><head><meta charset="utf-8"><link rel="stylesheet" href="../styles.css">
<style>body{margin:0;padding:16px;background:var(--surface);font-family:var(--font-ui)}.grid{display:grid;grid-template-columns:repeat(4,1fr);gap:14px}.k{font-family:var(--font-figure);font-size:10px;color:var(--neutral-500);display:block;margin-bottom:6px}.b{height:44px;border-radius:8px;display:flex;align-items:center;justify-content:center;font-size:13px;font-weight:500}.f{height:44px;border-radius:6px;padding:0 12px;display:flex;align-items:center;font-size:13px;color:var(--neutral-500)}</style>
</head><body>
<div class="grid"><div><span class="k">focus ring</span><div class="b" style="background:var(--primary);color:var(--surface);box-shadow:var(--focus-ring)">Continue</div></div><div><span class="k">hover — card</span><div class="b" style="background:var(--neutral-50);border:1px solid var(--primary-200);color:var(--ink)">Border, not shadow</div></div><div><span class="k">disabled</span><div class="b" style="background:var(--neutral-100);border:1px solid var(--neutral-200);color:var(--neutral-400)">File my return</div></div><div><span class="k">error field</span><div class="f" style="border:1px solid var(--notice);background:var(--surface)">9 characters</div><span style="font-size:12px;color:var(--notice-text)">PAN must be 10 characters. You entered 9.</span></div></div>
</body></html>
