<!-- @dsCard group="Brand" viewport="700x170" name="Elevation" subtitle="Documents lie flat. Resting elements use a border; shadow means genuinely floating." -->
<!DOCTYPE html><html lang="en"><head><meta charset="utf-8"><link rel="stylesheet" href="../styles.css">
<style>body{margin:0;padding:16px;background:var(--surface);font-family:var(--font-ui)}.row{display:flex;gap:16px}.b{flex:1;background:var(--surface);border-radius:12px;padding:14px;font-size:12px;color:var(--neutral-700);min-height:88px}.k{font-family:var(--font-figure);font-size:10px;color:var(--neutral-500);display:block;margin-bottom:6px}</style>
</head><body>
<div class="row"><div class="b" style="border:1px solid var(--neutral-200)"><span class="k">flat</span>Cards, panels, schedules, ledger blocks at rest. No shadow.</div><div class="b" style="box-shadow:var(--elev-raised)"><span class="k">raised</span>Dropdowns, popovers, autocomplete, date pickers.</div><div class="b" style="box-shadow:var(--elev-overlay)"><span class="k">overlay</span>Modals, bottom sheets, the expert panel on mobile.</div><div class="b" style="box-shadow:var(--elev-sticky);border-radius:0"><span class="k">sticky</span>Mobile action bar, review footer. Top hairline, no blur.</div></div>
</body></html>
