<!-- @dsCard group="Colors" viewport="700x150" name="Semantic tints" subtitle="Status backgrounds with their tested text colour" -->
<!DOCTYPE html><html lang="en"><head><meta charset="utf-8"><link rel="stylesheet" href="../styles.css">
<style>body{margin:0;padding:16px;background:var(--surface);font-family:var(--font-ui)}.grid{display:grid;grid-template-columns:repeat(5,1fr);gap:8px}.t{border:1px solid;border-radius:6px;padding:12px;height:96px;display:flex;flex-direction:column;justify-content:space-between}.l{font-size:13px;font-weight:600}.r{font-family:var(--font-figure);font-size:10px}</style>
</head><body>
<div class="grid"><div class="t" style="background:rgba(13,107,91,0.10);color:#0A5347;border-color:rgba(13,107,91,0.28)"><span class="l">Credit / seal</span><span class="r">#0A5347</span></div><div class="t" style="background:rgba(154,98,18,0.12);color:#7A4E0E;border-color:rgba(154,98,18,0.26)"><span class="l">Due / pending</span><span class="r">#7A4E0E</span></div><div class="t" style="background:rgba(179,38,30,0.10);color:#8C1D17;border-color:rgba(179,38,30,0.24)"><span class="l">Notice / error</span><span class="r">#8C1D17</span></div><div class="t" style="background:rgba(27,94,156,0.09);color:#134A7C;border-color:rgba(27,94,156,0.22)"><span class="l">Informational</span><span class="r">#134A7C</span></div><div class="t" style="background:#EEF1F5;color:#2A3849;border-color:#D9DEE6"><span class="l">Neutral / draft</span><span class="r">#2A3849</span></div></div>
<div style="margin-top:10px;background:var(--ink);border-radius:6px;padding:10px;display:flex;gap:8px;align-items:center;flex-wrap:wrap"><span style="font-family:var(--font-figure);font-size:10px;color:rgba(255,255,255,0.6);width:100%">on ink — surface text on 10% white; state colour in the dot</span><span style="display:inline-flex;align-items:center;gap:6px;height:24px;padding:0 10px;border-radius:9999px;background:rgba(255,255,255,0.10);border:1px solid rgba(255,255,255,0.28);color:var(--surface);font-size:12px;font-weight:500"><span style="width:6px;height:6px;border-radius:9999px;background:#8FE3D0"></span>e-Verified</span><span style="display:inline-flex;align-items:center;gap:6px;height:24px;padding:0 10px;border-radius:9999px;background:rgba(255,255,255,0.10);border:1px solid rgba(255,255,255,0.28);color:var(--surface);font-size:12px;font-weight:500"><span style="width:6px;height:6px;border-radius:9999px;background:#D89A3C"></span>Filed, verify within 30 days</span><span style="display:inline-flex;align-items:center;gap:6px;height:24px;padding:0 10px;border-radius:9999px;background:rgba(255,255,255,0.10);border:1px solid rgba(255,255,255,0.28);color:var(--surface);font-size:12px;font-weight:500"><span style="width:6px;height:6px;border-radius:9999px;background:#F08279"></span>Notice received</span></div>
</body></html>
