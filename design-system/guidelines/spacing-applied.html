<!-- @dsCard group="Spacing" viewport="700x180" name="Spacing in use" subtitle="Card padding, field stack, ledger row, section rhythm" -->
<!DOCTYPE html><html lang="en"><head><meta charset="utf-8"><link rel="stylesheet" href="../styles.css">
<style>body{margin:0;padding:16px;background:var(--surface);font-family:var(--font-ui)}.grid{display:grid;grid-template-columns:1fr 1fr;gap:16px}.card{border:1px solid var(--neutral-200);border-radius:12px;padding:24px;position:relative}.tag{position:absolute;top:4px;left:6px;font-family:var(--font-figure);font-size:10px;color:var(--neutral-500)}.f{height:44px;border:1px solid var(--neutral-300);border-radius:6px;background:var(--surface)}.stack{display:flex;flex-direction:column;gap:20px}.lr{display:flex;justify-content:space-between;padding:8px 0;border-bottom:1px solid var(--neutral-200);font-size:13px}.amt{font-family:var(--font-figure);font-variant-numeric:tabular-nums}</style>
</head><body>
<div class="grid"><div class="card"><span class="tag">card padding 24 · field gap 20</span><div class="stack"><div class="f"></div><div class="f"></div></div></div><div class="card" style="padding:20px"><span class="tag">ledger row padding-y 8</span><div class="lr"><span>Gross salary</span><span class="amt">14,80,000</span></div><div class="lr"><span>Standard deduction</span><span class="amt">75,000</span></div><div class="lr"><span>Income from salary</span><span class="amt">14,05,000</span></div></div></div>
</body></html>
