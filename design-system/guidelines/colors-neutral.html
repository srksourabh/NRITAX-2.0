<!DOCTYPE html><html lang="en"><head><meta charset="utf-8"><link rel="stylesheet" href="../styles.css">
<style>body{margin:0;padding:16px;background:var(--surface);font-family:var(--font-ui)}.grid{display:grid;gap:8px}.sw{height:96px;border-radius:6px;padding:10px;display:flex;flex-direction:column;justify-content:flex-end;border:1px solid rgba(20,26,34,0.08)}.n{font-size:12px;font-weight:600}.h{font-family:var(--font-figure);font-size:10px;opacity:.8}.grid{grid-template-columns:repeat(8,1fr)}.sw{height:104px}.note{margin-top:8px;font-size:11px;color:var(--neutral-500)}</style>
</head><body>
<div class="grid"><div class="sw" style="background:#F6F8F6;color:var(--ink)"><span class="n">50</span><span class="h">#F6F8F6</span></div><div class="sw" style="background:#E7EBE7;color:var(--ink)"><span class="n">100</span><span class="h">#E7EBE7</span></div><div class="sw" style="background:#D2D9D3;color:var(--ink)"><span class="n">200</span><span class="h">#D2D9D3 · rule</span></div><div class="sw" style="background:#B4BEB6;color:var(--ink)"><span class="n">300</span><span class="h">#B4BEB6</span></div><div class="sw" style="background:#8B9690;color:var(--ink)"><span class="n">400</span><span class="h">#8B9690 · 3.00:1</span></div><div class="sw" style="background:#5C6660;color:var(--surface)"><span class="n">500</span><span class="h">#5C6660</span></div><div class="sw" style="background:#39423C;color:var(--surface)"><span class="n">700</span><span class="h">#39423C</span></div><div class="sw" style="background:#141A22;color:var(--surface)"><span class="n">900</span><span class="h">#141A22</span></div></div><p class="note">neutral-400 fails 4.5:1 — decorative icons and dividers only. Placeholder text uses neutral-500.</p>
</body></html>
