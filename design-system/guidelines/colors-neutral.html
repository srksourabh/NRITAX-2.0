<!-- @dsCard group="Colors" viewport="700x150" name="Neutral ramp" subtitle="Cool ink cast. 400 is non-text only." -->
<!DOCTYPE html><html lang="en"><head><meta charset="utf-8"><link rel="stylesheet" href="../styles.css">
<style>body{margin:0;padding:16px;background:var(--surface);font-family:var(--font-ui)}.grid{display:grid;gap:8px}.sw{height:96px;border-radius:6px;padding:10px;display:flex;flex-direction:column;justify-content:flex-end;border:1px solid rgba(20,28,41,0.08)}.n{font-size:12px;font-weight:600}.h{font-family:var(--font-figure);font-size:10px;opacity:.8}.grid{grid-template-columns:repeat(8,1fr)}.sw{height:104px}.note{margin-top:8px;font-size:11px;color:var(--neutral-500)}</style>
</head><body>
<div class="grid"><div class="sw" style="background:#F8F9FB;color:var(--ink)"><span class="n">50</span><span class="h">#F8F9FB</span></div><div class="sw" style="background:#EEF1F5;color:var(--ink)"><span class="n">100</span><span class="h">#EEF1F5</span></div><div class="sw" style="background:#D9DEE6;color:var(--ink)"><span class="n">200</span><span class="h">#D9DEE6 · rule</span></div><div class="sw" style="background:#B8C0CC;color:var(--ink)"><span class="n">300</span><span class="h">#B8C0CC</span></div><div class="sw" style="background:#8A96A8;color:var(--ink)"><span class="n">400</span><span class="h">#8A96A8</span></div><div class="sw" style="background:#67748A;color:var(--surface)"><span class="n">500</span><span class="h">#67748A</span></div><div class="sw" style="background:#2A3849;color:var(--surface)"><span class="n">700</span><span class="h">#2A3849</span></div><div class="sw" style="background:#141C29;color:var(--surface)"><span class="n">900</span><span class="h">#141C29</span></div></div><p class="note">neutral-400 is decorative only. Placeholder text uses neutral-500.</p>
</body></html>
