<!DOCTYPE html><html lang="en"><head><meta charset="utf-8"><link rel="stylesheet" href="../styles.css">
<style>body{margin:0;padding:16px;background:var(--surface);font-family:var(--font-ui)}.sheet{max-width:420px;border:1px solid var(--neutral-200);padding:20px;background:var(--surface)}.r{display:flex;align-items:flex-start;gap:12px;padding:8px 0}.l{flex:1;font-size:13px}.s{font-family:var(--font-figure);font-size:10px;color:var(--neutral-500);padding-top:2px}.a{width:140px;text-align:right;font-family:var(--font-figure);font-size:15px;font-variant-numeric:tabular-nums lining-nums}.sub .a{border-top:1px solid var(--neutral-200);padding-top:6px}.fin .l{font-weight:600}.fin .a{font-size:24px;font-weight:500;border-top:1px solid var(--ink);padding-top:6px;position:relative}.fin .a:before{content:"";position:absolute;top:3px;left:0;right:0;height:1px;background:var(--ink)}.cur{text-align:right;width:140px;margin-left:auto;font-family:var(--font-figure);font-size:10px;color:var(--neutral-500)}</style>
</head><body>
<div class="sheet"><div class="cur">₹</div><div class="r "><span class="l">Gross salary</span><span class="s">u/s 17(1)</span><span class="a">14,80,000</span></div><div class="r "><span class="l">Less: standard deduction</span><span class="s">u/s 16(ia)</span><span class="a">75,000</span></div><div class="r sub"><span class="l">Income from salary</span><span class="s"></span><span class="a">14,05,000</span></div><div class="r "><span class="l">Less: TDS</span><span class="s">26AS</span><span class="a">1,12,000</span></div><div class="r fin"><span class="l">Refund due</span><span class="s"></span><span class="a">8,557</span></div></div>
</body></html>
