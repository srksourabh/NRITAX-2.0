<!DOCTYPE html><html lang="en"><head><meta charset="utf-8"><link rel="stylesheet" href="../styles.css">
<style>body{margin:0;padding:16px;background:var(--surface);font-family:var(--font-ui)}.grid{display:grid;gap:8px}.sw{height:96px;border-radius:6px;padding:10px;display:flex;flex-direction:column;justify-content:flex-end;border:1px solid rgba(20,28,41,0.08)}.n{font-size:12px;font-weight:600}.h{font-family:var(--font-figure);font-size:10px;opacity:.8}.grid{grid-template-columns:repeat(10,1fr)}.sw{height:104px;padding:8px}.n{font-size:11px}</style>
</head><body>
<div class="grid"><div class="sw" style="background:#EDF4FB;color:var(--ink)"><span class="n">50</span><span class="h">#EDF4FB</span></div><div class="sw" style="background:#D5E6F5;color:var(--ink)"><span class="n">100</span><span class="h">#D5E6F5</span></div><div class="sw" style="background:#A8CBE8;color:var(--ink)"><span class="n">200</span><span class="h">#A8CBE8</span></div><div class="sw" style="background:#6AA3D0;color:var(--ink)"><span class="n">300</span><span class="h">#6AA3D0</span></div><div class="sw" style="background:#3B7FB5;color:var(--surface)"><span class="n">400</span><span class="h">#3B7FB5</span></div><div class="sw" style="background:#1B5E9C;color:var(--surface)"><span class="n">500</span><span class="h">#1B5E9C</span></div><div class="sw" style="background:#164E82;color:var(--surface)"><span class="n">600</span><span class="h">#164E82</span></div><div class="sw" style="background:#113E68;color:var(--surface)"><span class="n">700</span><span class="h">#113E68</span></div><div class="sw" style="background:#0C2E4E;color:var(--surface)"><span class="n">800</span><span class="h">#0C2E4E</span></div><div class="sw" style="background:#071F35;color:var(--surface)"><span class="n">900</span><span class="h">#071F35</span></div></div>
</body></html>
