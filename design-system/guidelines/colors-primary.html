<!-- @dsCard group="Colors" viewport="700x150" name="Primary ramp" subtitle="500 is the interactive value; 50 and 100 are the only tinted backgrounds" -->
<!DOCTYPE html><html lang="en"><head><meta charset="utf-8"><link rel="stylesheet" href="../styles.css">
<style>body{margin:0;padding:16px;background:var(--surface);font-family:var(--font-ui)}.grid{display:grid;gap:8px}.sw{height:96px;border-radius:6px;padding:10px;display:flex;flex-direction:column;justify-content:flex-end;border:1px solid rgba(20,26,34,0.08)}.n{font-size:12px;font-weight:600}.h{font-family:var(--font-figure);font-size:10px;opacity:.8}.grid{grid-template-columns:repeat(10,1fr)}.sw{height:104px;padding:8px}.n{font-size:11px}</style>
</head><body>
<div class="grid"><div class="sw" style="background:#E8F1F7;color:var(--ink)"><span class="n">50</span><span class="h">#E8F1F7</span></div><div class="sw" style="background:#C9E0EF;color:var(--ink)"><span class="n">100</span><span class="h">#C9E0EF</span></div><div class="sw" style="background:#94C2DE;color:var(--ink)"><span class="n">200</span><span class="h">#94C2DE</span></div><div class="sw" style="background:#4E96C2;color:var(--ink)"><span class="n">300</span><span class="h">#4E96C2</span></div><div class="sw" style="background:#1B6EA3;color:var(--surface)"><span class="n">400</span><span class="h">#1B6EA3</span></div><div class="sw" style="background:#0B4A75;color:var(--surface)"><span class="n">500</span><span class="h">#0B4A75</span></div><div class="sw" style="background:#093C60;color:var(--surface)"><span class="n">600</span><span class="h">#093C60</span></div><div class="sw" style="background:#072F4B;color:var(--surface)"><span class="n">700</span><span class="h">#072F4B</span></div><div class="sw" style="background:#052236;color:var(--surface)"><span class="n">800</span><span class="h">#052236</span></div><div class="sw" style="background:#031622;color:var(--surface)"><span class="n">900</span><span class="h">#031622</span></div></div>
</body></html>
