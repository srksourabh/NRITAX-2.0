<!DOCTYPE html><html lang="en"><head><meta charset="utf-8"><link rel="stylesheet" href="../styles.css">
<style>body{margin:0;padding:16px;background:var(--surface);font-family:var(--font-ui)}.row{display:flex;gap:14px;align-items:flex-end}.c{text-align:center}.b{width:76px;height:60px;background:var(--primary-50);border:1px solid var(--primary-200)}.k{font-family:var(--font-figure);font-size:10px;color:var(--neutral-500);display:block;margin-top:6px}</style>
</head><body>
<div class="row"><div class="c"><div class="b" style="border-radius:0"></div><span class="k">none · 0</span></div><div class="c"><div class="b" style="border-radius:3px"></div><span class="k">xs · 3px</span></div><div class="c"><div class="b" style="border-radius:6px"></div><span class="k">sm · 6px</span></div><div class="c"><div class="b" style="border-radius:8px"></div><span class="k">md · 8px</span></div><div class="c"><div class="b" style="border-radius:12px"></div><span class="k">lg · 12px</span></div><div class="c"><div class="b" style="border-radius:16px"></div><span class="k">xl · 16px</span></div><div class="c"><div class="b" style="border-radius:9999px"></div><span class="k">full · 9999px</span></div></div>
</body></html>
