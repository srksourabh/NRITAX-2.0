<div class="grid"><div class="b"><span class="k">tax payable</span><span class="f" style="color:var(--ink)">₹24,310</span><span class="n">Ink. Owing tax is not wrong, so never notice red.</span></div><div class="b"><span class="k">refund due</span><span class="f" style="color:var(--credit)">₹8,557</span><span class="n">The only figure allowed to be green.</span></div><div class="b"><span class="k">deduction claimed</span><span class="f" style="color:var(--ink)">₹1,62,000</span><span class="n">Not green. Savings and projections stay ink.</span></div></div>
